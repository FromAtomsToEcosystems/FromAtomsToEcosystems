.lockmsg{min-height:24px}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile.gated{opacity:.45}.timer{font:600 16px monospace;color:var(--amber);margin-right:6px}

.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;font-weight:600}.frac span:last-child{border-top:2px solid currentColor}.pbr{font-size:18px;margin:6px 0}.pbr s{text-decoration-color:#f87171;text-decoration-thickness:2px;color:var(--muted)}</style></head><body>

<script>
const CFG = { key: 'fate_chem_heat_seeker_v1', activity: 'Heat Seeker', file: 'HeatSeeker', title: 'Heat Seeker', sub: 'Chemistry · Unit 6 · Reteach game: specific heat',
sections: [
 { id: 'intro', type: 'info', title: 'How to play', icon: 'cards', html: `<p>Race through specific heat, q = mcΔT, identifying metals, and calorimetry.</p><p>Pick a game mode. Every mode uses the same review questions:</p><ul><li><b>⚡ Blitz:</b> 75 seconds and 3 lives; answers in a row build a combo.</li><li><b>🪙 Gold Quest:</b> answer, then open a chest. Finish 1st against 3 rivals.</li><li><b>🏰 Castle Defense:</b> every right answer loads a cannonball that fires when monsters get close. Survive 75 seconds.</li><li><b>🎣 Fishing Frenzy:</b> right answers catch fish; streaks upgrade your lure. Reach 100 lb.</li><li><b>🚀 Space Race:</b> every right answer boosts your rocket. Beat 3 rivals.</li><li><b>🧠 Memory Match:</b> match each problem with its answer.</li></ul><p><b>Your score is your stars (up to 3):</b> ★ get 5 or more right in any round · ★ win any challenge (Blitz 1,500+, 1st in Gold Quest, save the castle, 100 lb of fish, or win the race) · ★ clear the Memory Match board. Play as many times as you like; your best counts.</p>` },
 { id: 'sim', type: 'sim', sim: 'game', title: 'Play', pts: 3, scoreKey: 'gStars', icon: 'sim' },
 { id: 'refl', type: 'short', title: 'Reflection', qs: [{ q: "What was hardest about specific heat, and what do you remember now?", pts: 1, groups: [[/\w{3,}.*\w{3,}.*\w{3,}.*\w{3,}/]], model: "Example: I used the final temperature instead of \u0394T. Now I remember to subtract final minus initial first.", bank: [['what was hard', /hard|tricky|mistake|wrong/i], ['what I do now', /now|remember|first|then/i], ['because', /because/i]] }] }
] };
CFG.sims = { game(el, api) { gameSim(el, api, { title: "Heat Seeker", pool: POOL, pairs: PAIRS }); } };
/* ===== Reteach game engine: Blitz (timer, lives, combos) + Memory Match ===== */
const GM_CSS = `
.gm-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.gm-stars{font-size:26px;letter-spacing:4px}.gm-stars .on{color:#f6b93b;text-shadow:0 0 10px rgba(246,185,59,.6)}.gm-stars .off{color:#334155}
.gm-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gm-mode{border:2px solid var(--line2);border-radius:16px;padding:16px;background:var(--panel2);text-align:left;color:var(--text);font:inherit;cursor:pointer}
.gm-mode:hover{border-color:var(--e)}.gm-mode h3{margin:0 0 4px;font-size:22px}.gm-mode p{margin:4px 0;color:var(--muted)}.gm-mode b{color:var(--amber)}
.gm-hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#0b1322;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:700}
.gm-hud .t{font-size:24px;color:var(--e);min-width:60px}.gm-hud .t.low{color:#f87171}.gm-hud .sc{font-size:22px;color:#f6b93b}.gm-hud .hearts{font-size:20px;letter-spacing:2px}.gm-hud .cmb{color:#4ade80}
.gm-bar{height:6px;background:#1e293b;border-radius:3px;overflow:hidden;flex:1;min-width:120px}.gm-bar i{display:block;height:100%;background:var(--e);transition:width .3s linear}
.gm-q{font-size:20px;margin:10px 0;min-height:56px}.gm-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.gm-o{padding:12px;border-radius:12px;border:2px solid var(--line2);background:var(--panel2);color:var(--text);font:600 17px var(--font);cursor:pointer;text-align:left}
.gm-o.right{border-color:#4ade80;background:rgba(74,222,128,.15)}.gm-o.wrong{border-color:#f87171;background:rgba(248,113,113,.15)}
.gm-num{display:flex;gap:8px;align-items:center}.gm-num input{font:600 20px var(--font);padding:8px 12px;border-radius:10px;border:2px solid var(--line2);background:var(--panel);color:var(--text);width:220px}
.gm-flash{min-height:28px;margin-top:8px;font-weight:700}.gm-flash.good{color:#4ade80}.gm-flash.bad{color:#f87171}
.gm-pop{animation:gmPop .35s ease}@keyframes gmPop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.gm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gm-card{min-height:78px;border-radius:12px;border:2px solid var(--line2);background:linear-gradient(135deg,#1e3a5f,#14304a);color:var(--text);font:600 15px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;line-height:1.25}
.gm-card.back{font-size:28px;color:#5fe1ff}.gm-card.up{background:var(--panel2);border-color:var(--e)}.gm-card.done{background:rgba(74,222,128,.12);border-color:#4ade80;cursor:default}
.gm-end{text-align:center;padding:14px}.gm-end h3{font-size:26px;margin:0 0 6px}.gm-end .big{font-size:40px;color:#f6b93b;font-weight:800}
@media (prefers-reduced-motion:reduce){.gm-pop{animation:none}.gm-bar i{transition:none}}.gm-lb{display:grid;gap:4px;margin:8px 0}.gm-lb div{display:flex;justify-content:space-between;background:#0b1322;border-radius:8px;padding:5px 10px;font-weight:700}.gm-lb .me{outline:2px solid #f6b93b}
.gm-chests{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.gm-chest{font-size:54px;padding:18px 6px;border-radius:16px;border:2px solid var(--line2);background:var(--panel2);cursor:pointer;color:var(--text)}.gm-chest small{display:block;font-size:15px;font-weight:700;margin-top:6px}.gm-chest.pick{border-color:#f6b93b;background:rgba(246,185,59,.15)}
.gm-field{width:100%;display:block;background:#0b1322;border-radius:12px;margin-bottom:10px}
.gm-big{font-size:28px;font-weight:800;color:#f6b93b}
`;
function gameSim(el, api, G) {
  if (!document.getElementById('gm-css')) { const s = document.createElement('style'); s.id = 'gm-css'; s.textContent = GM_CSS; document.head.appendChild(s); }
  const st = api.state.g || (api.state.g = { stars: [false, false, false], bestBlitz: 0, bestMoves: null, plays: 0 });
  const BLITZ_S = G.seconds || 75;
  let timer = null, R = null;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const starHTML = () => `<span class="gm-stars" aria-label="${st.stars.filter(Boolean).length} of 3 stars">${st.stars.map(s => `<span class="${s ? 'on' : 'off'}">★</span>`).join('')}</span>`;
  const award = (k) => { if (!st.stars[k]) { st.stars[k] = true; api.state.gStars = st.stars.filter(Boolean).length; if (api.state.gStars >= 1) api.done(); } api.save(); };
  const numOf = v => { let t = String(v ?? '').replace(/,/g, '').replace(/\s/g, '').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]/g, c => ({ '⁰': 0, '¹': 1, '²': 2, '³': 3, '⁴': 4, '⁵': 5, '⁶': 6, '⁷': 7, '⁸': 8, '⁹': 9, '⁻': '-' })[c]).replace(/[a-zA-Z₀-₉]+$/, '');
    t = t.replace(/(?:[x×*]10\^?|e)\(?([+-]?\d+)\)?$/i, 'e$1'); return /^-?\d*\.?\d+(e[+-]?\d+)?$/i.test(t) ? parseFloat(t) : NaN; };
  st.best = st.best || {};
  const MODES = [
    ['gmBlitz', '⚡ Blitz', `${BLITZ_S} seconds, 3 lives. Right answers in a row build a <b>combo</b>.`, () => `Best score: <b>${(st.bestBlitz || 0).toLocaleString()}</b>`, () => blitzStart()],
    ['gmGold', '🪙 Gold Quest', 'Answer, then open a chest: gold, ×2, steal from the leader… or lose some. Finish 1st against 3 rivals.', () => `Best gold: <b>${(st.best.gold || 0).toLocaleString()}</b>`, () => goldStart()],
    ['gmCastle', '🏰 Castle Defense', 'Monsters march at your castle. Every right answer loads a cannonball that fires when they get close. Survive 75 seconds.', () => `Most monsters stopped: <b>${st.best.castle || 0}</b>`, () => castleStart()],
    ['gmFish', '🎣 Fishing Frenzy', 'Right answers catch fish. Streaks upgrade your lure for bigger fish. Reach 100 lb in 2 minutes.', () => `Best catch: <b>${st.best.fish || 0} lb</b>`, () => fishStart()],
    ['gmRace', '🚀 Space Race', 'Every right answer boosts your rocket. Beat 3 rival rockets to the finish.', () => `Races won: <b>${st.best.race || 0}</b>`, () => raceStart()],
    ['gmMatch', '🧠 Memory Match', 'Flip two cards. Match each problem to its answer in as few moves as you can.', () => `Best: <b>${st.bestMoves ? st.bestMoves + ' moves' : 'not cleared yet'}</b>`, () => matchStart()]];
  function home() {
    clearInterval(timer); R = null;
    el.innerHTML = `<div class="gm-top"><div><b>${G.title}</b><div class="muted small">Earn stars: ★ get 5+ right in any round · ★ win any challenge (Blitz 1,500+, 1st in Gold Quest, save the castle, 100 lb of fish, win the race) · ★ clear the Memory board</div></div>${starHTML()}</div>
      <div class="gm-modes">${MODES.map(([id, h, p, best]) => `<button type="button" class="gm-mode" id="${id}"><h3>${h}</h3><p>${p}</p><p>${best()}</p></button>`).join('')}</div>
      <p class="muted small" style="margin-top:10px">Use the <b>Calculator</b> button at the top whenever you need it.</p>`;
    MODES.forEach(([id, , , , fn]) => el.querySelector('#' + id).addEventListener('click', () => { if (!api.locked) fn(); }));
  }
  /* ---------- shared question helpers for the challenge modes ---------- */
  function nextQ() { if (R.k >= R.deck.length) R.deck = R.deck.concat(shuffle(G.pool)); return R.deck[R.k++]; }
  function qHTML(q) { return `<div class="gm-q">${q.q}</div>` + (q.o ? `<div class="gm-opts">${q.o.map((o, i) => `<button type="button" class="gm-o" data-i="${i}">${o}</button>`).join('')}</div>`
      : `<div class="gm-num"><input id="gmIn" inputmode="decimal" autocomplete="off" placeholder="${q.ph || 'Type your answer'}"><button type="button" class="btn primary" id="gmGo">Enter</button></div>`); }
  function bindQ(box, q, cb) {
    let used = false; const fin = (ok, btn) => { if (used) return; used = true;
      if (!ok) { if (btn) btn.classList.add('wrong'); const r = box.querySelector(`.gm-o[data-i="${q.a}"]`); if (r) r.classList.add('right'); }
      else if (btn) btn.classList.add('right'); cb(ok); };
    box.querySelectorAll('.gm-o').forEach(b => b.addEventListener('click', () => fin(+b.dataset.i === q.a, b)));
    const inp = box.querySelector('#gmIn'); if (inp) { inp.focus(); const go = () => { const v = numOf(inp.value); if (isNaN(v)) { const f = box.querySelector('.gm-flash'); if (f) { f.className = 'gm-flash bad'; f.textContent = 'Type a number (like 2.00 or 1.20e24).'; } return; } fin(Math.abs(v - q.ans) <= Math.max(q.tol || 0.02, Math.abs(q.ans) * (q.rel || 0.01)), null); };
      box.querySelector('#gmGo').addEventListener('click', go); inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }); }
  }
  const showAns = q => `✗ ${q.why || ''}${q.o ? ` Answer: ${q.o[q.a]}` : ` Answer: ${q.show || q.ans}`}`;
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  function endCard(title, lines, won) {
    clearInterval(timer); const res = R; R = null;
    if (res.right >= 5) award(0); if (won) award(1); api.save();
    el.innerHTML = `<div class="gm-top"><b>${title}</b>${starHTML()}</div><div class="card" style="text-align:center"><p class="gm-big">${won ? '🏆 You won!' : 'Round over'}</p>${lines.map(l => `<p>${l}</p>`).join('')}<p>Right answers: <b>${res.right}</b></p>
      <div class="btn-row" style="justify-content:center"><button type="button" class="btn primary" id="gmAgain">Play again</button><button type="button" class="btn ghost" id="gmHome">Back to games</button></div></div>`;
    el.querySelector('#gmAgain').addEventListener('click', () => res.again()); el.querySelector('#gmHome').addEventListener('click', home);
  }
  /* ---------- Gold Quest ---------- */
  function goldStart() {
    R = { mode: 'gold', gold: 0, n: 0, N: 12, right: 0, deck: shuffle(G.pool), k: 0, bots: [{ n: 'Captain Byte', g: 0 }, { n: 'Nova', g: 0 }, { n: 'Pip', g: 0 }], phase: 'q', msg: '', again: goldStart };
    st.plays++; api.save(); goldQ();
  }
  const goldLB = () => `<div class="gm-lb">${[{ n: 'You', g: R.gold, me: 1 }].concat(R.bots).sort((a, b) => b.g - a.g).map((p, i) => `<div class="${p.me ? 'me' : ''}"><span>${i + 1}. ${p.n}</span><span>🪙 ${p.g}</span></div>`).join('')}</div>`;
  function botsTurn() { R.bots.forEach(b => b.g += rnd(20, 50)); }
  function goldQ() {
    if (!R) return; if (R.n >= R.N) return goldEnd();
    R.q = nextQ(); R.n++;
    el.innerHTML = `<div class="gm-hud"><span>Question ${R.n} of ${R.N}</span><span class="sc">🪙 ${R.gold}</span></div>${goldLB()}${qHTML(R.q)}<div class="gm-flash ${R.msg ? 'good' : ''}" aria-live="polite">${R.msg}</div><button type="button" class="btn ghost" id="gmQuit2" style="margin-top:6px">End round</button>`; el.querySelector('#gmQuit2').addEventListener('click', () => { if (R) goldEnd(); });
    R.msg = '';
    bindQ(el, R.q, ok => { if (ok) { R.right++; setTimeout(goldChests, 500); } else { const f = el.querySelector('.gm-flash'); f.className = 'gm-flash bad'; f.textContent = showAns(R.q) + ' No chest this time.'; botsTurn(); setTimeout(goldQ, 1900); } });
  }
  function chestRoll() {
    const r = Math.random(), lead = R.bots.slice().sort((a, b) => b.g - a.g)[0];

<script>
/* =========================================================
   CLOUD BACKUP (Saved Student Work sheet)
   Save code = student ID + last name. Work saves on this Chromebook AND in the cloud,

   ========================================================= */
(() => {
  const KEY = 'fate_chem_heat_seeker_v1', LESSON = 'Heat Seeker';
  const BACKUP_SAVE_URL = 'https://script.google.com/macros/s/AKfycbzs8JVNE3PU_idPirGkpCUq7FrNPB2sNxvd98tRfloumem5HtXHS8XwS2BIdmPz2c2h/exec';
  const saveURL = () => { try { if (typeof SAVE_WEBHOOK_URL !== 'undefined' && SAVE_WEBHOOK_URL) return SAVE_WEBHOOK_URL; } catch (e) {} return BACKUP_SAVE_URL; };

    if (st.items) p += 10 * Object.values(st.items).filter(x => x && (x.done || x.checked)).length;

  function livePreview() { try { const v = evaluate(inp.value, lastAns()); prev.textContent = inp.value.trim() && /[^0-9.]/.test(inp.value) ? '= ' + fmt(v) : ''; } catch (e) { prev.textContent = ''; } }
  function insert(t) { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + t + inp.value.slice(b); const c = a + t.length; inp.setSelectionRange(c, c); livePreview(); }
  function doEq() {
    const src = inp.value.trim(); if (!src) return;
    try { const v = evaluate(src, lastAns()); hist.push({ e: src, r: fmt(v), v }); saveH(); drawHist(); inp.value = ''; prev.textContent = ''; }
    catch (e) { prev.textContent = typeof e === 'string' ? e : 'Error'; prev.style.color = '#fca5a5'; setTimeout(() => { prev.style.color = ''; livePreview(); }, 1600); }
  }
  function setMode() { modeBtn.textContent = deg ? 'DEG' : 'RAD'; try { localStorage.setItem(MKEY, deg ? 'deg' : 'rad'); } catch (e) {} livePreview(); }
  box.querySelectorAll('.scalc-keys button').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (v === 'eq') doEq(); else if (v === 'ac') { inp.value = ''; prev.textContent = ''; }
    else if (v === 'back') { const a = inp.selectionStart, e2 = inp.selectionEnd; if (a !== e2) insert(''); else if (a > 0) { inp.value = inp.value.slice(0, a - 1) + inp.value.slice(a); inp.setSelectionRange(a - 1, a - 1); livePreview(); } }
    else if (v === 'mode') { deg = !deg; setMode(); }
    else { if (!inp.value && /^[+×÷^]/.test(v) && hist.length) insert('ans'); insert(v); }
    inp.focus({ preventScroll: true });
  }));
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); doEq(); } else if (e.key === 'Escape') box.hidden = true;
    else if (e.key.length === 1 && /[+*/^]/.test(e.key) && !inp.value && hist.length) { e.preventDefault(); insert('ans' + (e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key)); } });
  inp.addEventListener('input', livePreview);
  inp.addEventListener('keyup', e => e.stopPropagation()); inp.addEventListener('keypress', e => e.stopPropagation());
  box.querySelector('.scalc-x').addEventListener('click', () => { box.hidden = true; });
  box.querySelector('.scalc-clr').addEventListener('click', () => { hist = []; saveH(); drawHist(); inp.focus({ preventScroll: true }); });
  /* drag */
  const head = box.querySelector('.scalc-head'); let drag = null;
  head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const r = box.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if (!drag) return; box.style.left = Math.max(0, Math.min(innerWidth - 60, e.clientX - drag.dx)) + 'px'; box.style.top = Math.max(0, Math.min(innerHeight - 40, e.clientY - drag.dy)) + 'px'; box.style.right = 'auto'; });
  head.addEventListener('pointerup', () => { drag = null; });
  function toggle() { box.hidden = !box.hidden; if (!box.hidden) { drawHist(); setMode(); inp.focus({ preventScroll: true }); } }
  function mount() {
    document.body.appendChild(box);
    const tb = [...document.querySelectorAll('button, a')].find(b => /^\s*teacher\b/i.test(b.textContent || '') && b.offsetParent !== null) || [...document.querySelectorAll('button, a')].find(b => /^\s*teacher\b/i.test(b.textContent || ''));
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = ((tb && tb.className) || '') + ' scalc-btn'; btn.innerHTML = '🧮 Calculator'; btn.setAttribute('aria-label', 'Open the scientific calculator');
    btn.addEventListener('click', e => { e.preventDefault(); toggle(); });
    const aplus = !tb && [...document.querySelectorAll('button')].find(b => (b.textContent || '').trim() === 'A+');
    if (tb && tb.parentNode) tb.parentNode.insertBefore(btn, tb);
    else if (aplus && aplus.parentNode) { btn.className = (aplus.className || '') + ' scalc-btn'; btn.style.width = 'auto'; btn.style.padding = '0 10px'; aplus.parentNode.insertBefore(btn, aplus.nextSibling); }
    else { btn.style.cssText = 'position:fixed;right:14px;bottom:14px;z-index:99989;padding:8px 14px;border-radius:999px;border:1.5px solid #35496f;background:#0f1a2e;color:#e8eef8;font:600 14px system-ui;cursor:pointer'; document.body.appendChild(btn); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
  window.__sciCalcEval = (s, a) => fmt(evaluate(s, a));
})();

</script>
<script>
/* ===== Teacher: print the whole activity ===== */
(function () {
  if (window.__tPrint) return; window.__tPrint = true;
  const css = `@media print{.scalc,.scalc-btn,.tprint-btn,#lockOv,.toast,.cloudchip,#tPanel,.tpanel,[role=dialog].teacher,.navtiles,.topbar nav{display:none!important}
    body.printing-all .screen.print-on{display:block!important;break-before:page}
    body.ws-printing #app{display:none!important} body.ws-printing #wsPrintAll{display:block!important}
    body.printing-all .page{break-inside:auto}
    body.printing-all *{animation:none!important;transition:none!important}
    body.printing-all, body.printing-all *:not(svg):not(svg *){background:transparent!important;color:#111!important;box-shadow:none!important;text-shadow:none!important}
    body.printing-all{background:#fff!important}
    body.printing-all *:not(svg):not(svg *){border-color:#9aa5b5!important}
    body.printing-all .btn,body.printing-all .sec-foot,body.printing-all .unlock,body.printing-all .pr-btns,body.printing-all .btn-row .btn,body.printing-all .progress-pips,body.printing-all .pr-levels{display:none!important}
    body.printing-all svg{print-color-adjust:exact;-webkit-print-color-adjust:exact}
    body.printing-all .pr-pic,body.printing-all .pic,body.printing-all .tsvg,body.printing-all .bal-pics,body.printing-all .drop-fig,body.printing-all .eq-pics,body.printing-all .scene-wrap,body.printing-all .cnt-pic{background:#0c1424!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    body.printing-all .pr-pic *:not(svg):not(svg *),body.printing-all .pic *:not(svg):not(svg *),body.printing-all .drop-fig *:not(svg):not(svg *),body.printing-all .bal-pics *:not(svg):not(svg *),body.printing-all .eq-pics *:not(svg):not(svg *),body.printing-all .scene-wrap *:not(svg):not(svg *){color:#fff!important}
    body.printing-all input,body.printing-all select,body.printing-all textarea{border:1px solid #777!important}}
    #wsPrintAll{display:none}#wsPrintAll .ws-p{break-inside:avoid;margin-bottom:14px}`;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  function doPrint() {
    const restore = [];
    const panel = document.querySelector('#tPanel'); if (panel && !panel.hidden) { panel.hidden = true; restore.push(() => { panel.hidden = false; }); }
    document.querySelectorAll('.screen').forEach(s => { if (/scr-(0|9|10)$/.test(s.id) || s.classList.contains('on')) return; s.classList.add('on', 'print-on'); restore.push(() => s.classList.remove('on', 'print-on')); });
    document.querySelectorAll('.page[hidden]').forEach(p => { p.hidden = false; restore.push(() => { p.hidden = true; }); });
    if (typeof window.__wsPrintHTML === 'function') { const box = document.createElement('div'); box.id = 'wsPrintAll'; try { box.innerHTML = window.__wsPrintHTML(); } catch (e) { box.innerHTML = ''; }
      document.body.appendChild(box); document.body.classList.add('ws-printing'); restore.push(() => { box.remove(); document.body.classList.remove('ws-printing'); }); }
    document.body.classList.add('printing-all'); restore.push(() => document.body.classList.remove('printing-all'));
    const done = () => { window.removeEventListener('afterprint', done); restore.reverse().forEach(f => f()); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(() => { if (document.body.classList.contains('printing-all')) done(); }, 1500); }, 120);
  }
  window.__teacherPrint = doPrint;
  function mount() {
    const k = document.querySelector('#tKey') || document.querySelector('#tReset'); if (!k || document.querySelector('.tprint-btn')) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = (k.className || 'btn').replace(/\bamber\b|\bprimary\b/g, 'ghost') + ' tprint-btn';
    b.textContent = '🖨 Print this activity'; b.title = 'Prints every section. Turn on the answer key first to print the key.';
    b.addEventListener('click', doPrint); k.parentNode.insertBefore(b, k.nextSibling);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount); else mount();
})();

</script>
