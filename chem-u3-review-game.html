<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unit 3 Review Game | Chemistry</title>
<style>
:root{--bg:#0c1424;--panel:#14203a;--panel2:#1b2a49;--line2:#35496f;--text:#e8eef8;--muted:#a3b4d1;--e:#5fe1ff;--amber:#f6b93b;--good:#4ade80;--bad:#fb7185;--font:"Lexend","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:300 18px/1.5 var(--font);background:radial-gradient(900px 520px at 85% -8%,#1a2d52 0%,transparent 62%),var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #26375a}header h1{margin:0;font-size:22px;font-weight:600}
.btn{font:600 16px var(--font);border-radius:10px;padding:10px 18px;cursor:pointer;background:var(--panel2);color:var(--text);border:1.5px solid var(--line2)}.btn.primary{background:var(--e);color:#062430;border-color:var(--e)}.btn.sm{padding:6px 12px;font-size:14px}
main{padding:16px 20px;max-width:1300px;margin:0 auto}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cat{background:#17365d;border-radius:10px;padding:12px 8px;text-align:center;font-weight:600;font-size:clamp(13px,1.5vw,18px);min-height:70px;display:grid;place-items:center}
.cell{background:var(--panel2);border:1.5px solid var(--line2);border-radius:10px;height:clamp(60px,10vh,96px);font:700 clamp(22px,3vw,38px) var(--font);color:var(--amber);cursor:pointer}
.cell.used{opacity:.15;cursor:default}
.teams{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.team{flex:1;min-width:128px;background:var(--panel);border:1.5px solid var(--line2);border-radius:12px;padding:10px 14px;text-align:center}
.team input{background:transparent;border:0;color:var(--text);font:600 18px var(--font);text-align:center;width:100%}.team .sc{font:700 clamp(22px,2.4vw,32px) var(--font);color:var(--e)}.team .sc.neg{color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(4,8,18,.9);display:grid;place-items:center;z-index:20;padding:20px}.ov[hidden]{display:none}
.qbox{max-width:1000px;width:100%;text-align:center}.qbox .meta{color:var(--amber);font-weight:600;font-size:20px}.qbox .qt{font-size:clamp(26px,3.6vw,46px);font-weight:500;margin:20px 0}
.qbox .ans{font-size:clamp(22px,3vw,36px);color:var(--good);font-weight:600;margin:16px 0}.award{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.award{max-width:1200px;margin-left:auto;margin-right:auto}.award div{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:8px 10px}.award b{display:block;margin-bottom:6px}
.dd{font:800 clamp(30px,5vw,60px) var(--font);color:var(--amber)}.wager{font:600 22px var(--font);width:160px;text-align:center;padding:8px;border-radius:10px;border:1.5px solid var(--line2);background:var(--panel2);color:var(--text)}
.setup{max-width:640px;margin:40px auto;background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:24px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
</style></head><body>
<header><h1>Unit 3 Review: Chemical Reactions</h1><div class="row" style="margin:0"><button class="btn sm" id="finalBtn">Final question</button><button class="btn sm" id="newBtn">New game</button></div></header>
<main id="main"></main>
<div class="ov" id="ov" hidden><div class="qbox" id="qbox"></div></div>
<script>
const D = {"cats": ["Counting Atoms", "Reaction Types", "Predicting Products", "Balancing", "Conservation of Mass", "Vocabulary"], "q": [[["In CO₂, the small 2 tells you there are 2 of these atoms.", "Oxygen"], ["The number of hydrogen atoms in 3H₂O.", "6"], ["The number of oxygen atoms in Ca(OH)₂.", "2"], ["The total number of atoms in C₆H₁₂O₆.", "24"], ["The number of oxygen atoms in 2Al₂(SO₄)₃.", "24"]], [["A + B → AB is this type.", "Synthesis"], ["One reactant breaking into two or more products.", "Decomposition"], ["CH₄ + 2O₂ → CO₂ + 2H₂O is this type.", "Combustion"], ["Two compounds trade partners; often makes a precipitate.", "Double replacement"], ["Cl₂ + 2NaBr → 2NaCl + Br₂ is this type.", "Single replacement"]], [["The two products of a hydrocarbon burning completely.", "CO₂ and H₂O"], ["Mg + 2HCl → ? + H₂", "MgCl₂"], ["AgNO₃ + NaCl → AgCl + ?", "NaNO₃"], ["Fe + CuSO₄ → FeSO₄ + ?", "Cu"], ["Pb(NO₃)₂ + 2KI → ? + 2KNO₃ (a bright yellow solid)", "PbI₂"]], [["When balancing, you may change only these.", "Coefficients"], ["Balance: _H₂ + _O₂ → _H₂O", "2, 1, 2"], ["Balance: _N₂ + _H₂ → _NH₃", "1, 3, 2"], ["Balance: _Al + _O₂ → _Al₂O₃", "4, 3, 2"], ["Balance: _C₂H₆ + _O₂ → _CO₂ + _H₂O", "2, 7, 4, 6"]], [["Atoms are never created or destroyed in a reaction. This is the law of…", "Conservation of mass"], ["A sealed jar weighs 120.0 g before a reaction. Its mass after.", "120.0 g"], ["Why an open cup of baking soda + vinegar loses mass.", "CO₂ gas escapes"], ["10 g of A reacts completely with 6 g of B. The mass of the products.", "16 g"], ["Why changing H₂O to H₂O₂ is not allowed when balancing.", "It makes a different substance (hydrogen peroxide)"]], [["Substances on the left side of the arrow.", "Reactants"], ["A big number in front of a formula.", "Coefficient"], ["A solid that forms when two solutions mix.", "Precipitate"], ["A group of atoms that acts as one unit, like NO₃ or SO₄.", "Polyatomic ion"], ["A compound of only carbon and hydrogen, like CH₄.", "Hydrocarbon"]]], "final": ["Balance this equation and name its type: _Fe + _O₂ → _Fe₂O₃", "4Fe + 3O₂ → 2Fe₂O₃; synthesis."]};
const VALS = [100, 200, 300, 400, 500], KEY = 'fate_chem_u3_review_game_v1';
let G = null; try { G = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} };
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function setup() {
  $('#main').innerHTML = `<div class="setup"><h2 style="margin-top:0">Set up the game</h2><p class="muted">How many teams are playing?</p>
    <div class="row">${[2, 3, 4, 5, 6, 7, 8].map(n => `<button class="btn" data-n="${n}">${n} teams</button>`).join('')}</div>
    <p style="color:var(--muted);font-size:15px">Click a dollar value to open a question. Show the answer, then give or take points from a team. One question is a hidden Daily Double. The final question uses wagers.</p></div>`;
  document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const n = +b.dataset.n; G = { teams: Array.from({ length: n }, (_, i) => ({ name: 'Team ' + (i + 1), score: 0 })), used: {}, dd: Math.floor(Math.random() * 6) + '_' + (2 + Math.floor(Math.random() * 3)) }; save(); board(); });
}
function board() {
  let h = '<div class="board">' + D.cats.map(c => `<div class="cat">${esc(c)}</div>`).join('');
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { const k = c + '_' + r; h += `<button class="cell ${G.used[k] ? 'used' : ''}" data-k="${k}" ${G.used[k] ? 'disabled' : ''}>${VALS[r]}</button>`; }
  h += '</div><div class="teams">' + G.teams.map((t, i) => `<div class="team"><input value="${esc(t.name)}" data-t="${i}" aria-label="Team name"><div class="sc ${t.score < 0 ? 'neg' : ''}">${t.score}</div><div class="row" style="justify-content:center;margin:4px 0 0"><button class="btn sm" data-adj="${i}" data-d="-100">−100</button><button class="btn sm" data-adj="${i}" data-d="100">+100</button></div></div>`).join('') + '</div>';
  $('#main').innerHTML = h;
  document.querySelectorAll('.cell:not(.used)').forEach(b => b.onclick = () => open(b.dataset.k));
  document.querySelectorAll('[data-t]').forEach(i => i.oninput = () => { G.teams[+i.dataset.t].name = i.value; save(); });
  document.querySelectorAll('[data-adj]').forEach(b => b.onclick = () => { G.teams[+b.dataset.adj].score += +b.dataset.d; save(); board(); });
}
function awardHTML(val, wager) {
  return `<div class="award">${G.teams.map((t, i) => `<div><b>${esc(t.name)}</b>${wager ? `<input class="wager" type="number" min="0" data-w="${i}" placeholder="wager">` : ''}<div class="row" style="justify-content:center;margin:6px 0 0"><button class="btn sm" data-ok="${i}">✓ Right</button><button class="btn sm" data-no="${i}">✗ Wrong</button></div></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="closeQ">Done</button></div>`;
}
function open(k) {
  const [c, r] = k.split('_').map(Number), [q, a] = D.q[c][r], isDD = k === G.dd; let val = VALS[r];
  const show = () => {
    $('#qbox').innerHTML = `<div class="meta">${esc(D.cats[c])} · ${isDD ? 'Daily Double' : val}</div><div class="qt">${esc(q)}</div><button class="btn primary" id="showA">Show the answer</button><div id="aArea"></div>`;
    $('#showA').onclick = () => { $('#showA').remove(); $('#aArea').innerHTML = `<div class="ans">${esc(a)}</div>${isDD ? `<div class="award"><div><b>${esc(G.teams[G.ddTeam].name)} wagered ${val}</b><div class="row" style="justify-content:center;margin:6px 0 0"><button class="btn sm" data-ok="${G.ddTeam}">✓ Right</button><button class="btn sm" data-no="${G.ddTeam}">✗ Wrong</button></div></div></div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="closeQ">Done</button></div>` : awardHTML(val)}`;
      document.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => { G.teams[+b.dataset.ok].score += val; b.closest('div').querySelectorAll('button').forEach(x => x.disabled = true); save(); });
      document.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { G.teams[+b.dataset.no].score -= val; b.closest('div').querySelectorAll('button').forEach(x => x.disabled = true); save(); });
      $('#closeQ').onclick = close; };
  };
  G.used[k] = true; save(); $('#ov').hidden = false;
  if (isDD) {
    $('#qbox').innerHTML = `<div class="dd">DAILY DOUBLE!</div><p>Which team found it?</p><div class="row" style="justify-content:center">${G.teams.map((t, i) => `<button class="btn" data-dt="${i}">${esc(t.name)}</button>`).join('')}</div><div id="wg"></div>`;
    document.querySelectorAll('[data-dt]').forEach(b => b.onclick = () => { G.ddTeam = +b.dataset.dt; const max = Math.max(500, G.teams[G.ddTeam].score);
      $('#wg').innerHTML = `<p>Wager up to ${max}:</p><input class="wager" id="ddw" type="number" min="0" max="${max}" value="${VALS[r]}"><div class="row" style="justify-content:center"><button class="btn primary" id="ddGo">Show the question</button></div>`;
      $('#ddGo').onclick = () => { val = Math.max(0, Math.min(max, +$('#ddw').value || 0)); show(); }; });
  } else show();
}
function close() { $('#ov').hidden = true; board(); }
function final() {
  const [q, a] = D.final; $('#ov').hidden = false;
  $('#qbox').innerHTML = `<div class="meta">Final question · Category: Balancing and Types</div><p>Each team writes a wager (up to its score) before seeing the question.</p><button class="btn primary" id="fq">Show the question</button><div id="fa"></div>`;
  $('#fq').onclick = () => { $('#fq').remove(); $('#fa').innerHTML = `<div class="qt">${esc(q)}</div><button class="btn primary" id="fs">Show the answer</button><div id="fb"></div>`;
    $('#fs').onclick = () => { $('#fs').remove(); $('#fb').innerHTML = `<div class="ans">${esc(a)}</div>${awardHTML(0, true)}`;
      document.querySelectorAll('[data-ok],[data-no]').forEach(b => b.onclick = () => { const i = +(b.dataset.ok ?? b.dataset.no), w = Math.max(0, +document.querySelector(`[data-w="${i}"]`).value || 0); G.teams[i].score += b.dataset.ok != null ? w : -w; b.closest('div').parentElement.querySelectorAll('button,input').forEach(x => x.disabled = true); save(); });
      $('#closeQ').onclick = close; }; };
}
$('#newBtn').onclick = () => { if (confirm('Start a new game? Scores will be erased.')) { G = null; localStorage.removeItem(KEY); setup(); } };
$('#finalBtn').onclick = () => { if (G) final(); };
if (G) board(); else setup();
</script></body></html>
