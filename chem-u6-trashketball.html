<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 6 Trashketball | Chemistry Unit 6</title>
<style>
:root{--bg:#0b1322;--panel:#13203a;--ink:#e8eef8;--mut:#94a3b8;--acc:#f97316;--ok:#4ade80;--bad:#f87171;--gold:#f6b93b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0f1a2e;border-bottom:1px solid #1e2c4a}header h1{margin:0;font-size:22px;flex:1}header .sub{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #2b3b5c;background:#1b2a48;color:var(--ink);padding:10px 16px;font-size:17px}button:hover{filter:brightness(1.15)}button.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:800}button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1300px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 320px;gap:18px}
.card{background:var(--panel);border:1px solid #1e2c4a;border-radius:18px;padding:22px}
.turn{font-size:18px;color:var(--mut)}.turn b{color:var(--gold);font-size:24px}
.topic{display:inline-block;background:#1e2c4a;border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mut);margin:6px 0}
.q{font-size:32px;font-weight:700;line-height:1.3;margin:10px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{font-size:24px;text-align:left;padding:16px;border-radius:14px;background:#0f1a2e;border:2px solid #2b3b5c}.opt b{color:var(--gold);margin-right:8px}
.opt.right{border-color:var(--ok);background:#12301f}.why{margin-top:14px;font-size:20px;color:var(--ok);min-height:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}.timer.low{color:var(--bad)}
.shot{margin-top:16px;padding:16px;border:2px dashed var(--acc);border-radius:14px}.shot h3{margin:0 0 8px;font-size:22px}
.board h2{margin:0 0 10px;font-size:20px}.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:6px;background:#0f1a2e}.team.now{outline:3px solid var(--gold)}
.team .nm{flex:1;font-size:18px;font-weight:700}.team .pts{font-size:26px;font-weight:800;color:var(--gold);min-width:44px;text-align:right}.team .adj{padding:2px 9px;font-size:15px;border-radius:8px}
.bar{height:6px;background:#1e2c4a;border-radius:4px;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.setup{max-width:760px;margin:40px auto}.setup label{display:block;margin:10px 0 4px;color:var(--mut)}.setup input{font:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:1px solid #2b3b5c;background:#0f1a2e;color:var(--ink);width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rules{color:var(--mut);font-size:16px;line-height:1.5}
.court{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}.court span{padding:6px 14px;border-radius:999px;background:#1e2c4a;font-weight:700}
.win{font-size:42px;font-weight:800;color:var(--gold);text-align:center;margin:20px 0}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.q{font-size:24px}.opt{font-size:19px}}
</style></head><body>
<header><h1>🏀 Unit 6 Trashketball</h1><span class="sub">Energy, Rates, and Solutions</span><button id="bNew">New game</button></header>
<div id="app"></div>
<script>
const Q = [{"t": "Specific Heat and Calorimetry", "q": "Specific heat is the energy needed to…", "o": ["raise 1 g of a substance by 1 °C", "melt 1 g of a substance", "boil 1 kg of water", "raise 1 mole by 100 °C"], "why": "J/g·°C."}, {"t": "Specific Heat and Calorimetry", "q": "The same heat goes into 100 g of water and 100 g of copper. Which warms more?", "o": ["Copper", "Water", "They warm equally", "Neither"], "why": "Lower specific heat → bigger ΔT."}, {"t": "Specific Heat and Calorimetry", "q": "How much heat warms 50.0 g of water (4.18 J/g·°C) by 10.0 °C?", "o": ["2,090 J", "209 J", "500 J", "20,900 J"], "why": "50.0 × 4.18 × 10.0."}, {"t": "Specific Heat and Calorimetry", "q": "2,090 J is added to 100 g of water. What is ΔT?", "o": ["5.0 °C", "20.9 °C", "0.5 °C", "50 °C"], "why": "2,090 ÷ 418."}, {"t": "Specific Heat and Calorimetry", "q": "A 50.0 g metal absorbs 449 J and warms 20.0 °C. Its specific heat is…", "o": ["0.449 J/g·°C (iron)", "4.18 J/g·°C", "0.897 J/g·°C", "22.45 J/g·°C"], "why": "449 ÷ 1,000."}, {"t": "Specific Heat and Calorimetry", "q": "In a calorimeter, heat lost by a hot metal…", "o": ["equals the heat gained by the water", "is destroyed", "is more than the water gains", "is zero"], "why": "Energy is conserved."}, {"t": "Endothermic and Exothermic", "q": "An instant cold pack gets cold because its reaction is…", "o": ["endothermic", "exothermic", "neutral", "a catalyst"], "why": "It absorbs energy."}, {"t": "Endothermic and Exothermic", "q": "ΔH equals…", "o": ["products − reactants", "reactants − products", "the top of the hill − reactants", "zero"], "why": "Enthalpy change."}, {"t": "Endothermic and Exothermic", "q": "Reactants 150 kJ, top 200 kJ, products 50 kJ. ΔH is…", "o": ["−100 kJ", "+100 kJ", "50 kJ", "200 kJ"], "why": "50 − 150."}, {"t": "Endothermic and Exothermic", "q": "For the same diagram, Eₐ is…", "o": ["50 kJ", "150 kJ", "100 kJ", "200 kJ"], "why": "200 − 150."}, {"t": "Endothermic and Exothermic", "q": "An endothermic reaction has products that are…", "o": ["higher in energy than the reactants", "lower than the reactants", "equal to the reactants", "at zero"], "why": "Uphill."}, {"t": "Endothermic and Exothermic", "q": "A catalyst changes…", "o": ["the activation energy only", "ΔH only", "both Eₐ and ΔH", "neither"], "why": "Lower hill, same start and end."}, {"t": "Reaction Rates", "q": "Collision theory says particles react when they collide with…", "o": ["enough energy and the right orientation", "any energy at all", "the container walls", "no energy"], "why": "Most collisions just bounce."}, {"t": "Reaction Rates", "q": "Raising the temperature speeds a reaction mainly because…", "o": ["more collisions have enough energy to react", "Eₐ goes down", "particles get bigger", "more reactant appears"], "why": "More particles above Eₐ."}, {"t": "Reaction Rates", "q": "Which gives a solid the greatest surface area?", "o": ["Grinding it into powder", "Leaving it as one block", "Cutting it in half", "Freezing it"], "why": "Smallest pieces."}, {"t": "Reaction Rates", "q": "60 mL of gas is made in 15 s. The rate is…", "o": ["4.0 mL/s", "900 mL/s", "0.25 mL/s", "45 mL/s"], "why": "60 ÷ 15."}, {"t": "Reaction Rates", "q": "A splint flames in pure oxygen but only glows in air. The factor is…", "o": ["concentration", "surface area", "a catalyst", "temperature"], "why": "More O₂ particles."}, {"t": "Reaction Rates", "q": "On a gas-made vs. time graph, the fastest reaction has…", "o": ["the steepest line", "the flattest line", "the lowest line always", "no line"], "why": "Most gas per second."}, {"t": "Equilibrium and Le Chatelier", "q": "At equilibrium…", "o": ["forward and reverse rates are equal", "the reaction stops", "amounts of reactants and products must be equal", "only the forward reaction happens"], "why": "Dynamic equilibrium."}, {"t": "Equilibrium and Le Chatelier", "q": "In A + B ⇌ C, adding more C shifts the equilibrium…", "o": ["left", "right", "nowhere", "both ways"], "why": "Away from what is added."}, {"t": "Equilibrium and Le Chatelier", "q": "In N₂ + 3H₂ ⇌ 2NH₃ (all gases), increasing the pressure shifts it…", "o": ["right", "left", "nowhere", "both ways"], "why": "4 moles → 2 moles."}, {"t": "Equilibrium and Le Chatelier", "q": "For A + B ⇌ C + heat, raising the temperature shifts it…", "o": ["left", "right", "nowhere", "both ways"], "why": "Heat is a product."}, {"t": "Equilibrium and Le Chatelier", "q": "Adding a catalyst to a system at equilibrium…", "o": ["causes no shift", "shifts it right", "shifts it left", "stops it"], "why": "Speeds both directions equally."}, {"t": "Equilibrium and Le Chatelier", "q": "Soda fizzes when opened because…", "o": ["lower pressure shifts CO₂(aq) ⇌ CO₂(g) toward the gas", "air enters the bottle", "the soda heats up", "the sugar reacts"], "why": "Toward more gas moles."}, {"t": "Solubility, Molarity, and Dilutions", "q": "A point below a solubility curve is…", "o": ["unsaturated", "saturated", "supersaturated", "a gas"], "why": "More could dissolve."}, {"t": "Solubility, Molarity, and Dilutions", "q": "Saturated KNO₃ cools from 60 °C (110 g) to 20 °C (32 g). Crystals that form:", "o": ["78 g", "110 g", "32 g", "142 g"], "why": "110 − 32."}, {"t": "Solubility, Molarity, and Dilutions", "q": "Gases dissolve better in…", "o": ["cold water", "hot water", "boiling water", "stirred water only"], "why": "Opposite of most solids."}, {"t": "Solubility, Molarity, and Dilutions", "q": "The molarity of 0.50 mol of solute in 250 mL of solution is…", "o": ["2.0 M", "0.125 M", "0.002 M", "125 M"], "why": "0.50 ÷ 0.250."}, {"t": "Solubility, Molarity, and Dilutions", "q": "How many grams of NaOH (40.00 g/mol) are needed for 1.00 L of 0.50 M?", "o": ["20.0 g", "80.0 g", "0.50 g", "40.0 g"], "why": "0.50 mol × 40.00."}, {"t": "Solubility, Molarity, and Dilutions", "q": "How much 2.00 M stock is needed for 500 mL of 0.100 M?", "o": ["25.0 mL", "10,000 mL", "100 mL", "250 mL"], "why": "(0.100 × 500) ÷ 2.00."}, {"t": "Acids and Bases", "q": "An acid releases which ion in water?", "o": ["H⁺", "OH⁻", "Na⁺", "Cl⁻"], "why": "Hydrogen ions."}, {"t": "Acids and Bases", "q": "A pH of 11 is…", "o": ["basic", "acidic", "neutral", "impossible"], "why": "Above 7."}, {"t": "Acids and Bases", "q": "pH 2 is how many times more acidic than pH 5?", "o": ["1,000", "3", "30", "100"], "why": "10 × 10 × 10."}, {"t": "Acids and Bases", "q": "Phenolphthalein turns pink in…", "o": ["a base", "an acid", "pure water", "any solution"], "why": "Pink = base."}, {"t": "Acids and Bases", "q": "HCl + NaOH →", "o": ["NaCl + H₂O", "NaOH + HCl", "H₂ + O₂", "Na + Cl"], "why": "Neutralization."}, {"t": "Acids and Bases", "q": "An antacid relieves heartburn because it…", "o": ["is a base that neutralizes stomach acid", "adds more acid", "is neutral sugar", "is a catalyst"], "why": "Acid + base → salt + water."}];
const KEY = 'fate_chem_u6_trashketball_v1';
let S = load() || null, tick = null;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setup() {
  clearInterval(tick);
  $('#app').innerHTML = `<div class="setup card"><h2>Set up the game</h2>
    <p class="rules"><b>How to play:</b> Teams take turns. Read the question aloud and start the timer. If the team answers correctly, they earn <b>1 point</b> and one shot at the trash can: tape lines on the floor for <b>1, 2, and 3 points</b>. A wrong answer passes the turn. Highest score wins.</p>
    <label>How many teams?</label><input id="nT" type="number" min="2" max="8" value="8">
    <label>Seconds per question</label><input id="nS" type="number" min="10" max="180" value="45">
    <label>Team names (optional)</label><div class="names" id="names"></div>
    <div class="row"><button class="pri" id="go">Start game</button></div></div>`;
  const names = () => { const n = Math.max(2, Math.min(8, +$('#nT').value || 8)); $('#names').innerHTML = Array.from({ length: n }, (_, i) => `<input data-i="${i}" placeholder="Group ${i + 1}">`).join(''); };
  names(); $('#nT').addEventListener('input', names);
  $('#go').addEventListener('click', () => {
    const n = Math.max(2, Math.min(8, +$('#nT').value || 8));
    const teams = Array.from({ length: n }, (_, i) => ({ name: (document.querySelector(`#names input[data-i="${i}"]`).value || '').trim() || `Group ${i + 1}`, pts: 0 }));
    S = { teams, turn: 0, order: shuffle(Q.map((_, i) => i)), qi: 0, phase: 'ask', secs: Math.max(10, +$('#nS').value || 45), left: null, asked: 0 };
    save(); play();
  });
}
function cur() { return Q[S.order[S.qi % S.order.length]]; }
function play() {
  clearInterval(tick);
  const q = cur(), t = S.teams[S.turn], shown = S.phase !== 'ask', max = Math.max(1, ...S.teams.map(x => x.pts));
  $('#app').innerHTML = `<div class="wrap"><div class="card">
    <div class="turn">Up now: <b>${t.name}</b> · Question ${S.asked + 1}</div><span class="topic">${q.t}</span>
    <div class="q">${q.q}</div>
    <div class="opts">${q.o.map((o, k) => `<div class="opt ${shown && k === 0 ? 'right' : ''}"><b>${'ABCD'[k]}</b>${o}</div>`).join('')}</div>
    <div class="why">${shown ? '✓ ' + q.o[0] + ' · ' + q.why : ''}</div>
    <div class="row"><span class="timer" id="tm">${S.left ?? S.secs}</span><button id="tGo">Start timer</button><button id="show" ${shown ? 'disabled' : ''}>Show answer</button>
      ${S.phase === 'shown' ? `<button class="pri" id="ok">✓ Correct (+1)</button><button id="no">✗ Wrong (pass)</button>` : ''}</div>
    ${S.phase === 'shoot' ? `<div class="shot"><h3>🏀 ${t.name} takes a shot!</h3><div class="court"><span>1-pt line</span><span>2-pt line</span><span>3-pt line</span></div>
      <div class="row"><button data-s="0">Missed</button><button class="pri" data-s="1">Made 1-pt</button><button class="pri" data-s="2">Made 2-pt</button><button class="pri" data-s="3">Made 3-pt</button></div></div>` : ''}
    </div>
    <div class="card board"><h2>Scoreboard</h2>${S.teams.map((x, i) => `<div class="team ${i === S.turn ? 'now' : ''}"><div style="flex:1"><div class="nm">${x.name}</div><div class="bar"><i style="width:${x.pts / max * 100}%"></i></div></div><button class="adj" data-a="${i}" data-d="-1">−</button><button class="adj" data-a="${i}" data-d="1">+</button><span class="pts">${x.pts}</span></div>`).join('')}
      <div class="row"><button id="skip">Skip question</button><button id="end">End game</button></div></div></div>`;
  // ---- order the options so the correct one is not always A: shuffle positions per question but keep the "right" index
  const optEls = [...document.querySelectorAll('.opt')], perm = permFor(S.order[S.qi % S.order.length]);
  const box = document.querySelector('.opts'); perm.forEach((k, pos) => { const el = optEls[k]; el.querySelector('b').textContent = 'ABCD'[pos]; box.appendChild(el); });
  if (shown) $('.why').textContent = '✓ ' + 'ABCD'[perm.indexOf(0)] + '. ' + q.o[0] + ' · ' + q.why;
  $('#tGo').addEventListener('click', () => { clearInterval(tick); if (S.left == null || S.left <= 0) S.left = S.secs; tick = setInterval(() => { S.left--; const e = $('#tm'); if (!e) return clearInterval(tick); e.textContent = Math.max(0, S.left); e.classList.toggle('low', S.left <= 10); if (S.left <= 0) clearInterval(tick); }, 1000); });
  $('#show').addEventListener('click', () => { clearInterval(tick); S.phase = 'shown'; save(); play(); });
  const okb = $('#ok'); if (okb) okb.addEventListener('click', () => { t.pts += 1; S.phase = 'shoot'; save(); play(); });
  const nob = $('#no'); if (nob) nob.addEventListener('click', () => next());
  document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => { t.pts += +b.dataset.s; next(); }));
  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { const x = S.teams[+b.dataset.a]; x.pts = Math.max(0, x.pts + +b.dataset.d); save(); play(); }));
  $('#skip').addEventListener('click', () => { S.qi++; S.phase = 'ask'; S.left = null; save(); play(); });
  $('#end').addEventListener('click', () => { if (confirm('End the game and show the winner?')) finish(); });
}
function permFor(i) { const p = [0, 1, 2, 3].slice(0, Q[i].o.length); let r = (i * 7 + 3) % p.length; const a = p.slice(1); a.splice(r, 0, 0); return a; }
function next() { S.turn = (S.turn + 1) % S.teams.length; S.qi++; S.asked++; S.phase = 'ask'; S.left = null; save(); play(); }
function finish() {
  clearInterval(tick); const rank = S.teams.slice().sort((a, b) => b.pts - a.pts), top = rank[0].pts, winners = rank.filter(x => x.pts === top).map(x => x.name);
  $('#app').innerHTML = `<div class="setup card"><div class="win">🏆 ${winners.join(' & ')} ${winners.length > 1 ? 'tie' : 'wins'}!</div>${rank.map((x, i) => `<div class="team"><span class="nm">${i + 1}. ${x.name}</span><span class="pts">${x.pts}</span></div>`).join('')}<div class="row"><button class="pri" id="again">New game</button><button id="back">Back to the game</button></div></div>`;
  $('#again').addEventListener('click', () => { S = null; save(); setup(); }); $('#back').addEventListener('click', play);
}
document.getElementById('bNew').addEventListener('click', () => { if (!S || confirm('Start a new game? The current scores will be cleared.')) { S = null; localStorage.removeItem(KEY); setup(); } });
S ? play() : setup();
</script></body></html>
