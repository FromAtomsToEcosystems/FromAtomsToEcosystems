<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 5 Trashketball | Biology Unit 5</title>
<style>
:root{--bg:#0b1322;--panel:#13203a;--ink:#e8eef8;--mut:#94a3b8;--acc:#f97316;--ok:#4ade80;--bad:#f87171;--gold:#f6b93b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0f1a2e;border-bottom:1px solid #1e2c4a}header h1{margin:0;font-size:22px;flex:1}header .sub{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #2b3b5c;background:#1b2a48;color:var(--ink);padding:10px 16px;font-size:17px}button:hover{filter:brightness(1.15)}button.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:800}button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1300px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 320px;gap:18px}
.card{background:var(--panel);border:1px solid #1e2c4a;border-radius:18px;padding:22px}
.turn{font-size:18px;color:var(--mut)}.turn b{color:var(--gold);font-size:24px}
.topic{display:inline-block;background:#1e2c4a;border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mut);margin:6px 0}
.q{font-size:32px;font-weight:700;line-height:1.3;margin:10px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{font-size:24px;text-align:left;padding:16px;border-radius:14px;background:#0f1a2e;border:2px solid #2b3b5c}.opt b{color:var(--gold);margin-right:8px}
.opt.right{border-color:var(--ok);background:#12301f}.why{margin-top:14px;font-size:20px;color:var(--ok);min-height:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}.timer.low{color:var(--bad)}
.shot{margin-top:16px;padding:16px;border:2px dashed var(--acc);border-radius:14px}.shot h3{margin:0 0 8px;font-size:22px}
.board h2{margin:0 0 10px;font-size:20px}.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:6px;background:#0f1a2e}.team.now{outline:3px solid var(--gold)}
.team .nm{flex:1;font-size:18px;font-weight:700}.team .pts{font-size:26px;font-weight:800;color:var(--gold);min-width:44px;text-align:right}.team .adj{padding:2px 9px;font-size:15px;border-radius:8px}
.bar{height:6px;background:#1e2c4a;border-radius:4px;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.setup{max-width:760px;margin:40px auto}.setup label{display:block;margin:10px 0 4px;color:var(--mut)}.setup input{font:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:1px solid #2b3b5c;background:#0f1a2e;color:var(--ink);width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rules{color:var(--mut);font-size:16px;line-height:1.5}
.court{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}.court span{padding:6px 14px;border-radius:999px;background:#1e2c4a;font-weight:700}
.win{font-size:42px;font-weight:800;color:var(--gold);text-align:center;margin:20px 0}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.q{font-size:24px}.opt{font-size:19px}}
</style></head><body>
<header><h1>🏀 Unit 5 Trashketball</h1><span class="sub">Evolution</span><button id="bNew">New game</button></header>
<div id="app"></div>
<script>
const Q = [{"t": "Evidence of Evolution", "q": "A human arm and a whale flipper have the same kinds of bones in the same order. These are:", "o": ["Homologous structures", "Transitional fossils", "Analogous structures", "Vestigial structures"], "why": ""}, {"t": "Evidence of Evolution", "q": "A bird wing and a butterfly wing both help with flying, but they are built differently. These are:", "o": ["Analogous structures", "Embryos", "Vestigial structures", "Homologous structures"], "why": ""}, {"t": "Evidence of Evolution", "q": "What is a transitional fossil?", "o": ["A fossil with features of an older group and a newer group", "A fossil of a plant", "Any fossil found near the top of a cliff", "A fossil that is still alive"], "why": ""}, {"t": "Evidence of Evolution", "q": "In rock layers that have not been disturbed, which layer is the oldest?", "o": ["The bottom (deepest) layer", "The top layer", "All layers are the same age", "The middle layer"], "why": ""}, {"t": "Evidence of Evolution", "q": "Which statement about humans and chimpanzees is correct?", "o": ["They share a common ancestor that lived about 6 to 7 million years ago", "They are not related", "Humans evolved from chimpanzees", "Chimpanzees evolved from humans"], "why": ""}, {"t": "Evidence of Evolution", "q": "On a cladogram, what does a node (branch point) stand for?", "o": ["A common ancestor", "An extinct species that turned into a living one", "The newest species", "A species living today"], "why": ""}, {"t": "Evidence of Evolution", "q": "Species A has 2 amino acid differences from humans in a protein. Species B has 20. Which is more closely related to humans?", "o": ["Species A", "They are equally related", "Species B", "You cannot tell from proteins"], "why": ""}, {"t": "Evidence of Evolution", "q": "Early fish and human embryos both have pouches in the neck and a tail. What does this suggest?", "o": ["They share a common ancestor", "Humans evolved from modern fish", "Human embryos grow gills that they breathe with", "The embryos are identical"], "why": ""}, {"t": "Natural Selection", "q": "Which are the two main sources of inherited variation?", "o": ["Mutations and sexual reproduction", "Injuries and scars", "Learning and practice", "Exercise and diet"], "why": ""}, {"t": "Natural Selection", "q": "Which scientist published <i>On the Origin of Species</i> in 1859, explaining natural selection?", "o": ["Charles Darwin", "Gregor Mendel", "Rosalind Franklin", "Louis Pasteur"], "why": ""}, {"t": "Natural Selection", "q": "A curve gets <b>narrower and taller</b> around the average after selection. Which type is it?", "o": ["Stabilizing", "No selection", "Disruptive", "Directional"], "why": ""}, {"t": "Natural Selection", "q": "A curve of body size <b>shifts to the right</b> after selection. Which type is it?", "o": ["Directional", "Disruptive", "Stabilizing", "No selection"], "why": ""}, {"t": "Natural Selection", "q": "A curve <b>splits into two peaks</b> after selection. Which type is it?", "o": ["Disruptive", "Stabilizing", "No selection", "Directional"], "why": ""}, {"t": "Natural Selection", "q": "What evolves during natural selection?", "o": ["A population, over many generations", "Nothing changes", "One individual, during its life", "One cell, in a day"], "why": ""}, {"t": "Natural Selection", "q": "What does <b>overproduction</b> mean?", "o": ["Organisms make more offspring than can survive", "Organisms make exactly as many offspring as can survive", "Only the strongest organisms reproduce", "Populations always grow larger"], "why": ""}, {"t": "Natural Selection", "q": "What does <b>fitness</b> mean in biology?", "o": ["How well an organism survives and reproduces", "How strong an organism is", "How big an organism is", "How fast an organism runs"], "why": ""}, {"t": "Speciation", "q": "What must happen <b>first</b> for one population to split into two species?", "o": ["The groups become reproductively isolated, so they stop mating with each other", "The groups must mate more often", "Each animal decides to change", "A new allele must appear in every individual"], "why": ""}, {"t": "Speciation", "q": "Two groups of crickets live together, but females only respond to the chirp song of their own group. What kind of isolation is this?", "o": ["Behavioral", "Temporal", "Bottleneck", "Geographic"], "why": ""}, {"t": "Speciation", "q": "Hunting leaves only a few northern elephant seals. Today there are many seals, but they have very little genetic variation. This is an example of the:", "o": ["Bottleneck effect", "Founder effect", "Behavioral isolation", "Gene flow"], "why": ""}, {"t": "Speciation", "q": "Two populations of frogs live in the same pond. One breeds in March and the other in June. What kind of isolation is this?", "o": ["Temporal", "Geographic", "Gene flow", "Behavioral"], "why": ""}, {"t": "Speciation", "q": "What is genetic drift?", "o": ["A random change in allele frequencies caused by chance", "Change caused only by natural selection", "Animals choosing better traits", "Alleles moving between populations"], "why": ""}, {"t": "Speciation", "q": "A horse and a donkey have a mule. The mule almost always can't have babies. What does this tell you?", "o": ["Horses and donkeys are different species", "Horses and donkeys are the same species", "Donkeys are not fertile", "Mules are a third kind of horse"], "why": ""}, {"t": "Speciation", "q": "What is a gene pool?", "o": ["All the alleles of all the individuals in a population", "The place where a species lives", "The genes of one organism", "A group of different species"], "why": ""}, {"t": "Speciation", "q": "A river changes course and splits a population of snails. What kind of isolation is this?", "o": ["Geographic", "Temporal", "Founder effect", "Behavioral"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Living things make more offspring than can survive.</i>", "o": ["overproduction", "directional selection", "disruptive selection", "natural selection"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Individuals with helpful inherited traits survive and reproduce more, so those traits become more common over generations.</i>", "o": ["natural selection", "disruptive selection", "inherited trait", "population"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>When one population splits into groups that can no longer interbreed, and a new kind of organism forms.</i>", "o": ["speciation", "gene flow", "reproductive isolation", "allele"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>A group of organisms that can mate with each other and produce fertile offspring.</i>", "o": ["species", "temporal isolation", "gene pool", "founder effect"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Comparing the sequence of DNA bases or amino acids between species. Fewer differences means the species are more closely related.</i>", "o": ["molecular evidence", "homologous structures", "vestigial structure", "embryo"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Both extremes of a trait are favored and the middle is not, so the graph splits into two peaks.</i>", "o": ["disruptive selection", "adaptation", "directional selection", "inherited trait"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Genetic drift that happens when a few individuals leave and start a new population.</i>", "o": ["founder effect", "genetic drift", "reproductive isolation", "species"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Differences in traits among individuals of the same species.</i>", "o": ["variation", "evolution", "fitness", "stabilizing selection"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>All the alleles of all the individuals in a population.</i>", "o": ["gene pool", "genetic drift", "reproductive isolation", "behavioral isolation"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>Genetic drift that happens when a population suddenly becomes very small.</i>", "o": ["bottleneck effect", "species", "genetic drift", "speciation"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>A ____ passed from parents to offspring in their genes.</i>", "o": ["inherited trait", "variation", "competition", "adaptation"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>When two populations can no longer mate with each other, or their offspring are not fertile.</i>", "o": ["reproductive isolation", "allele", "species", "geographic isolation"], "why": ""}];
const KEY = 'fate_biol_u5_trashketball_v1';
let S = load() || null, tick = null;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setup() {
  clearInterval(tick);
  $('#app').innerHTML = `<div class="setup card"><h2>Set up the game</h2>
    <p class="rules"><b>How to play:</b> Teams take turns. Read the question aloud and start the timer. If the team answers correctly, they earn <b>1 point</b> and one shot at the trash can: tape lines on the floor for <b>1, 2, and 3 points</b>. A wrong answer passes the turn. Highest score wins.</p>
    <label>How many teams?</label><input id="nT" type="number" min="2" max="8" value="8">
    <label>Seconds per question</label><input id="nS" type="number" min="10" max="180" value="45">
    <label>Team names (optional)</label><div class="names" id="names"></div>
    <div class="row"><button class="pri" id="go">Start game</button></div></div>`;
  const names = () => { const n = Math.max(2, Math.min(8, +$('#nT').value || 8)); $('#names').innerHTML = Array.from({ length: n }, (_, i) => `<input data-i="${i}" placeholder="Group ${i + 1}">`).join(''); };
  names(); $('#nT').addEventListener('input', names);
  $('#go').addEventListener('click', () => {
    const n = Math.max(2, Math.min(8, +$('#nT').value || 8));
    const teams = Array.from({ length: n }, (_, i) => ({ name: (document.querySelector(`#names input[data-i="${i}"]`).value || '').trim() || `Group ${i + 1}`, pts: 0 }));
    S = { teams, turn: 0, order: shuffle(Q.map((_, i) => i)), qi: 0, phase: 'ask', secs: Math.max(10, +$('#nS').value || 45), left: null, asked: 0 };
    save(); play();
  });
}
function cur() { return Q[S.order[S.qi % S.order.length]]; }
function play() {
  clearInterval(tick);
  const q = cur(), t = S.teams[S.turn], shown = S.phase !== 'ask', max = Math.max(1, ...S.teams.map(x => x.pts));
  $('#app').innerHTML = `<div class="wrap"><div class="card">
    <div class="turn">Up now: <b>${t.name}</b> · Question ${S.asked + 1}</div><span class="topic">${q.t}</span>
    <div class="q">${q.q}</div>
    <div class="opts">${q.o.map((o, k) => `<div class="opt ${shown && k === 0 ? 'right' : ''}"><b>${'ABCD'[k]}</b>${o}</div>`).join('')}</div>
    <div class="why">${shown ? '✓ ' + q.o[0] + (q.why ? ' · ' + q.why : '') : ''}</div>
    <div class="row"><span class="timer" id="tm">${S.left ?? S.secs}</span><button id="tGo">Start timer</button><button id="show" ${shown ? 'disabled' : ''}>Show answer</button>
      ${S.phase === 'shown' ? `<button class="pri" id="ok">✓ Correct (+1)</button><button id="no">✗ Wrong (pass)</button>` : ''}</div>
    ${S.phase === 'shoot' ? `<div class="shot"><h3>🏀 ${t.name} takes a shot!</h3><div class="court"><span>1-pt line</span><span>2-pt line</span><span>3-pt line</span></div>
      <div class="row"><button data-s="0">Missed</button><button class="pri" data-s="1">Made 1-pt</button><button class="pri" data-s="2">Made 2-pt</button><button class="pri" data-s="3">Made 3-pt</button></div></div>` : ''}
    </div>
    <div class="card board"><h2>Scoreboard</h2>${S.teams.map((x, i) => `<div class="team ${i === S.turn ? 'now' : ''}"><div style="flex:1"><div class="nm">${x.name}</div><div class="bar"><i style="width:${x.pts / max * 100}%"></i></div></div><button class="adj" data-a="${i}" data-d="-1">−</button><button class="adj" data-a="${i}" data-d="1">+</button><span class="pts">${x.pts}</span></div>`).join('')}
      <div class="row"><button id="skip">Skip question</button><button id="end">End game</button></div></div></div>`;
  // ---- order the options so the correct one is not always A: shuffle positions per question but keep the "right" index
  const optEls = [...document.querySelectorAll('.opt')], perm = permFor(S.order[S.qi % S.order.length]);
  const box = document.querySelector('.opts'); perm.forEach((k, pos) => { const el = optEls[k]; el.querySelector('b').textContent = 'ABCD'[pos]; box.appendChild(el); });
  if (shown) $('.why').textContent = '✓ ' + 'ABCD'[perm.indexOf(0)] + '. ' + q.o[0] + (q.why ? ' · ' + q.why : '');
  $('#tGo').addEventListener('click', () => { clearInterval(tick); if (S.left == null || S.left <= 0) S.left = S.secs; tick = setInterval(() => { S.left--; const e = $('#tm'); if (!e) return clearInterval(tick); e.textContent = Math.max(0, S.left); e.classList.toggle('low', S.left <= 10); if (S.left <= 0) clearInterval(tick); }, 1000); });
  $('#show').addEventListener('click', () => { clearInterval(tick); S.phase = 'shown'; save(); play(); });
  const okb = $('#ok'); if (okb) okb.addEventListener('click', () => { t.pts += 1; S.phase = 'shoot'; save(); play(); });
  const nob = $('#no'); if (nob) nob.addEventListener('click', () => next());
  document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => { t.pts += +b.dataset.s; next(); }));
  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { const x = S.teams[+b.dataset.a]; x.pts = Math.max(0, x.pts + +b.dataset.d); save(); play(); }));
  $('#skip').addEventListener('click', () => { S.qi++; S.phase = 'ask'; S.left = null; save(); play(); });
  $('#end').addEventListener('click', () => { if (confirm('End the game and show the winner?')) finish(); });
}
function permFor(i) { const p = [0, 1, 2, 3].slice(0, Q[i].o.length); let r = (i * 7 + 3) % p.length; const a = p.slice(1); a.splice(r, 0, 0); return a; }
function next() { S.turn = (S.turn + 1) % S.teams.length; S.qi++; S.asked++; S.phase = 'ask'; S.left = null; save(); play(); }
function finish() {
  clearInterval(tick); const rank = S.teams.slice().sort((a, b) => b.pts - a.pts), top = rank[0].pts, winners = rank.filter(x => x.pts === top).map(x => x.name);
  $('#app').innerHTML = `<div class="setup card"><div class="win">🏆 ${winners.join(' & ')} ${winners.length > 1 ? 'tie' : 'wins'}!</div>${rank.map((x, i) => `<div class="team"><span class="nm">${i + 1}. ${x.name}</span><span class="pts">${x.pts}</span></div>`).join('')}<div class="row"><button class="pri" id="again">New game</button><button id="back">Back to the game</button></div></div>`;
  $('#again').addEventListener('click', () => { S = null; save(); setup(); }); $('#back').addEventListener('click', play);
}
document.getElementById('bNew').addEventListener('click', () => { if (!S || confirm('Start a new game? The current scores will be cleared.')) { S = null; localStorage.removeItem(KEY); setup(); } });
S ? play() : setup();
</script></body></html>
