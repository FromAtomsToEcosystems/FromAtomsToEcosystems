<style>

<script>
(() => {
const ACTIVITY = 'Osmosis and Cell Transport Review';
const KEY = 'fate_bio_u2_osmosis_transport_review_v1', TEACHER_CODE = 'Austin';
const BACKUP_URL = 'https://script.google.com/macros/s/AKfycbxogHjPorTs1pPPt8TCxY_WzG3FAlfsz2a8rt3yVt7_4N_Y62OjQmyiWtmSY6i07Kja/exec';
const BACKUP_TEACHERS = ['Austin', 'Mueller', 'McCue', 'Arce', 'Trimm', 'Garcia'];
const teacherList = () => { try { if (typeof TEACHERS !== 'undefined' && Array.isArray(TEACHERS) && TEACHERS.length) return TEACHERS.map(String); } catch (e) {} return BACKUP_TEACHERS; };
const sheetURL = () => { try { if (typeof SHEETS_WEBHOOK_URL !== 'undefined' && SHEETS_WEBHOOK_URL && String(SHEETS_WEBHOOK_URL).indexOf('PASTE') < 0) return String(SHEETS_WEBHOOK_URL); } catch (e) {} return BACKUP_URL; };
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const NS = 'http://www.w3.org/2000/svg';

/* ---------------- content ---------------- */
const T = ['hypotonic', 'hypertonic', 'isotonic'], MOVE = ['into', 'out of', 'in and out of (equally)'], SIZE = ['grow', 'shrink', 'stay the same'];
/* cell [solute, water, which one is blank], solution [solute, water, blank] */
const BK = [[30, 70, 's', 53, 47, 'w'], [30, 70, 'w', 30, 70, 'w'], [40, 60, 's', 10, 90, 'w'], [40, 60, 'w', 20, 80, 'w'], [12, 88, 's', 85, 15, 's'],
  [33, 67, 'w', 21, 79, 'w'], [44, 56, 's', 44, 56, 'w'], [30, 70, 's', 30, 70, 's'], [82, 18, 's', 23, 77, 's'], [23, 77, 'w', 65, 35, 'w']];
function bkAnswers(b) {
  const [cs, , , ss] = b;
  if (cs > ss) return { cell: 'hypertonic', sol: 'hypotonic', move: 'into', size: 'grow' };
  if (cs < ss) return { cell: 'hypotonic', sol: 'hypertonic', move: 'out of', size: 'shrink' };
  return { cell: 'isotonic', sol: 'isotonic', move: 'in and out of (equally)', size: 'stay the same' };
}
const SODA = { cells: 'hypotonic', sol: 'hypertonic', what: 'Water', dir: 'out of', res: 'shrink', until: 'equal to' };
const TR_OPTS = { rep: ['simple diffusion', 'facilitated diffusion', 'osmosis', 'active transport'], mol: ['oxygen', 'glucose', 'water'], thru: ['the lipid bilayer', 'a protein channel'], hl: ['high', 'low'], proc: ['passive', 'active'], en: ['does not', 'does'] };
const TR = [
  { id: 'trA', ans: { rep: 'facilitated diffusion', mol: 'glucose', thru: 'a protein channel', from: 'high', to: 'low', proc: 'passive', en: 'does not' },
    why: 'The molecules are large and pass through a protein channel, from the side with more (bottom) to the side with fewer (top). Moving from high to low is passive and needs no energy, so this is facilitated diffusion. Glucose is a large molecule that needs a protein channel.' },
  { id: 'trB', ans: { rep: 'osmosis', mol: 'water', thru: 'the lipid bilayer', from: 'high', to: 'low', proc: 'passive', en: 'does not' },
    why: 'These are water molecules crossing right through the lipid bilayer from the side with more water (bottom) to the side with less (top). The diffusion of water is osmosis, which is passive.' },
  { id: 'trC', ans: { rep: 'simple diffusion', mol: 'oxygen', thru: 'the lipid bilayer', from: 'high', to: 'low', proc: 'passive', en: 'does not' },
    why: 'Small molecules slip straight through the lipid bilayer from the crowded side (top) to the less crowded side (bottom), with no protein. This is simple diffusion, like oxygen entering a cell. It is passive.' }
];
const ITEMS = [...BK.map((b, i) => 'bk' + i), 'soda', ...TR.map(t => t.id)];
const N = ITEMS.length;

/* ---------------- state ---------------- */
const DEF = () => ({ student: { first: '', last: '', period: '', teacher: '', sid: '' }, started: false, items: {}, sentAt: null, keyShown: false });
let S; try { S = Object.assign(DEF(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { S = DEF(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const it = id => S.items[id] || (S.items[id] = { v: {}, tries: 0, done: false, first: null });
const peek = id => S.items[id] || { v: {}, done: false };
const doneCount = () => ITEMS.filter(id => peek(id).done).length;
const blanksOf = id => Object.keys(answersFor(id)).length;
const TOTAL = () => ITEMS.reduce((a, id) => a + blanksOf(id), 0);
const pts = id => peek(id).pts || 0;
const score = () => ITEMS.reduce((a, id) => a + pts(id), 0);
const allRight = () => ITEMS.filter(id => peek(id).done && pts(id) === blanksOf(id)).length;

/* ---------------- pictures ---------------- */
function beakerSVG(i) {
  const b = BK[i], st = peek('bk' + i), v = st.v;
  const show = (val, k) => st.done || (v[k] && +v[k] === val) ? val : '?';
  const cS = b[2] === 's' ? show(b[0], 'cs') : b[0], cW = b[2] === 'w' ? show(b[1], 'cw') : b[1];
  const sS = b[5] === 's' ? show(b[3], 'ss') : b[3], sW = b[5] === 'w' ? show(b[4], 'sw') : b[4];
  return `<svg class="bk" id="bksvg${i}" viewBox="0 0 200 200" role="img" aria-label="Beaker ${i + 1}. The cell inside is ${b[0]} percent solute and ${b[1]} percent water. The solution around it is ${b[3]} percent solute and ${b[4]} percent water.">
    <path d="M12 14 H188 L172 38 V176 a12 12 0 0 1 -12 12 H40 a12 12 0 0 1 -12 -12 V38 Z" fill="#0f1a2e" stroke="#e2e8f0" stroke-width="6" stroke-linejoin="round"/>
    <path d="M31 96 H169 V174 a10 10 0 0 1 -10 10 H41 a10 10 0 0 1 -10 -10 Z" fill="#bfdbfe" opacity=".85"/>
    <g class="ptcl">${[[52, 120], [140, 112], [70, 165], [128, 160], [100, 176], [150, 140]].slice(0, Math.max(1, Math.round(b[3] / 15))).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="#f59e0b" class="jig" style="--jx:2px;--jy:-2px"/>`).join('')}</g>
    <rect x="44" y="140" width="76" height="34" rx="4" fill="#fff" opacity=".9"/><text x="82" y="154" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220">${sS} % Solute</text><text x="82" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220">${sW} % Water</text>
    <g class="cellg" id="cell${i}" style="transform:scale(${st.done ? ({ grow: 1.16, shrink: .78, 'stay the same': 1 })[bkAnswers(b).size] : 1})"><circle cx="96" cy="78" r="44" fill="#f8fafc" stroke="#0b1220" stroke-width="3"/>
    <text x="96" y="74" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220">${cS} % Solute</text><text x="96" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0b1220">${cW} % Water</text></g>
    <g class="flowg"></g></svg>`;
}
function animateBeaker(i) {
  const svg = $('#bksvg' + i); if (!svg) return; const a = bkAnswers(BK[i]), g = $('.flowg', svg); g.innerHTML = '';
  const cellG = $('#cell' + i); cellG.style.transform = 'scale(1)';
  requestAnimationFrame(() => setTimeout(() => { cellG.style.transform = `scale(${({ grow: 1.16, shrink: .78, 'stay the same': 1 })[a.size]})`; }, 60));
  const pts = [[40, 112], [160, 118], [60, 186], [140, 186], [100, 190]];
  pts.forEach(([x, y], k) => {
    const dirs = a.move === 'into' ? ['in'] : a.move === 'out of' ? ['out'] : [k % 2 ? 'in' : 'out'];
    dirs.forEach(d => { const c = document.createElementNS(NS, 'circle'); const sx = d === 'in' ? x : 96, sy = d === 'in' ? y : 78;
      c.setAttribute('cx', sx); c.setAttribute('cy', sy); c.setAttribute('r', 4.5); c.setAttribute('class', 'wd mv');
      c.style.setProperty('--dx', `${(d === 'in' ? 96 - x : x - 96) * 0.85}px`); c.style.setProperty('--dy', `${(d === 'in' ? 78 - y : y - 78) * 0.85}px`); c.style.animationDelay = `${k * 0.3}s`; g.appendChild(c); });
  });
}
function sodaSVG() {
  const st = peek('soda');
  let s = `<svg class="soda" id="sodaSvg" viewBox="0 0 300 220" role="img" aria-label="A cell with many water molecules (blue) inside. Outside the cell are many glucose molecules (orange) from soda, plus a few water molecules.">
    <g class="cellg" id="sodaCell" style="transform:scale(${st.done ? .78 : 1})"><circle cx="140" cy="110" r="74" fill="#fde68a" stroke="#0b1220" stroke-width="4"/>`;
  [[110, 70], [150, 60], [180, 90], [120, 110], [160, 120], [100, 140], [140, 150], [185, 140], [130, 85], [165, 160]].forEach(([x, y], k) => { s += `<circle cx="${x}" cy="${y}" r="8" fill="#22d3ee" class="jig" style="--jx:${k % 2 ? 3 : -3}px;--jy:${k % 3 ? 2 : -2}px;animation-delay:${k * .2}s"/>`; });
  s += `</g>`;
  [[30, 40], [40, 120], [55, 190], [100, 205], [175, 205], [230, 185], [260, 120], [255, 40], [215, 18], [70, 25], [20, 80], [270, 160]].forEach(([x, y], k) => { s += `<circle cx="${x}" cy="${y}" r="8" fill="#f97316" class="jig" style="--jx:${k % 2 ? 2 : -2}px;--jy:2px;animation-delay:${k * .17}s"/>`; });
  [[240, 70], [30, 160]].forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="8" fill="#22d3ee"/>`; });
  return s + `<g class="flowg"></g></svg>`;
}
function animateSoda() {
  const svg = $('#sodaSvg'); if (!svg) return; const g = $('.flowg', svg); g.innerHTML = '';
  const cell = $('#sodaCell'); cell.style.transform = 'scale(1)'; setTimeout(() => { cell.style.transform = 'scale(.78)'; }, 80);
  [[40, 60], [250, 90], [60, 200], [240, 190], [140, 210], [20, 120]].forEach(([x, y], k) => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', 140); c.setAttribute('cy', 110); c.setAttribute('r', 7); c.setAttribute('class', 'wd mv');
    c.style.setProperty('--dx', `${x - 140}px`); c.style.setProperty('--dy', `${y - 110}px`); c.style.animationDelay = `${k * .3}s`; g.appendChild(c); });
}
/* membrane: heads + tails, an optional protein channel; molecules flow along given lanes */
function memSVG(kind) {
  const W = 340, H = 230, top = 92, bot = 150;
  const headCol = kind === 'trA' ? '#f59e0b' : kind === 'trB' ? '#a3477a' : '#4caf50';
  let s = `<svg class="mem" viewBox="0 0 ${W} ${H}" role="img" aria-label="${({ trA: 'Membrane with a protein channel. Many purple pentagon molecules are below the membrane and one is above. An arrow points up through the protein channel.', trB: 'Membrane with a protein. A few water molecules are above and many below. An arrow points up through the phospholipids, not the protein.', trC: 'Membrane with a protein. Many triangle molecules are above and a few below. Arrows point down through the phospholipids.' })[kind]}">`;
  const heads = []; for (let x = 20; x <= 320; x += 22) if (x < 150 || x > 196) heads.push(x);
  heads.forEach(x => { s += `<path d="M${x - 4} ${top + 10} q4 6 0 12 q-4 6 0 12 M${x + 4} ${top + 10} q4 6 0 12 q-4 6 0 12 M${x - 4} ${bot - 34} q4 6 0 12 q-4 6 0 12 M${x + 4} ${bot - 34} q4 6 0 12 q-4 6 0 12" stroke="#cbd5e1" stroke-width="2" fill="none"/>

  const arrow = (x, up) => `<path d="M${x - 5} ${up ? bot + 2 : top - 2} V${up ? top + 14 : bot - 14} h-6 l11 ${up ? -16 : 16} l11 ${up ? 16 : -16} h-6 V${up ? bot + 2 : top - 2} Z" fill="#fde047" stroke="#0b1220" stroke-width="1.5" opacity=".9"/>`;
  const shape = (k, x, y, extra = '') => k === 'trA' ? `<path transform="translate(${x} ${y})" d="M0 -12 L11 -4 L7 10 L-7 10 L-11 -4 Z" fill="#6b46c1" ${extra}/>` : k === 'trB' ? `<circle cx="${x}" cy="${y}" r="7" fill="#2563eb" ${extra}/>` : `<path transform="translate(${x} ${y})" d="M0 -11 L10 8 L-10 8 Z" fill="${(x + y) % 2 ? '#b91c1c' : '#eab308'}" ${extra}/>`;
  if (kind === 'trA') {
    s += arrow(173, true);
    [[40, 200], [100, 205], [230, 200], [290, 195], [300, 215]].forEach(([x, y], k) => { s += shape(kind, x, y, `class="jig" style="--jx:3px;--jy:-2px;animation-delay:${k * .3}s"`); });
    s += shape(kind, 120, 30, 'class="jig"');
    [0, 1, 2].forEach(k => { s += `<g class="flow" style="--x0:0px;--y0:0px;--x1:0px;--y1:-150px;--t:3.6s;--d:${k * 1.2}s">${shape(kind, 173, 200)}</g>`; });
  } else if (kind === 'trB') {
    s += arrow(64, true);
    [[60, 22], [120, 28], [260, 24]].forEach(([x, y]) => { s += shape(kind, x, y, 'class="jig"'); });
    [[40, 190], [90, 205], [140, 195], [210, 200], [260, 190], [300, 205]].forEach(([x, y], k) => { s += shape(kind, x, y, `class="jig" style="animation-delay:${k * .25}s"`); });
    [0, 1, 2, 3].forEach(k => { s += `<g class="flow" style="--x0:0px;--y0:0px;--x1:0px;--y1:-165px;--t:3s;--d:${k * .75}s">${shape(kind, 86 + (k % 2) * 22, 196)}</g>`; });
  } else {
    s += arrow(64, false) + arrow(268, false);
    [[30, 25], [70, 18], [110, 30], [150, 15], [200, 28], [240, 18], [280, 30], [310, 15]].forEach(([x, y], k) => { s += shape(kind, x, y, `class="jig" style="animation-delay:${k * .2}s"`); });
    [[120, 205], [180, 210], [240, 205]].forEach(([x, y]) => { s += shape(kind, x, y, 'class="jig"'); });
    [0, 1, 2, 3].forEach(k => { s += `<g class="flow" style="--x0:0px;--y0:0px;--x1:0px;--y1:170px;--t:3.2s;--d:${k * .8}s">${shape(kind, k % 2 ? 86 : 246, 30)}</g>`; });
  }
  return s + '</svg>';
}

/* ---------------- question HTML ---------------- */
const dd = (id, k, opts, sv) => `<select class="dd" data-id="${id}" data-k="${k}" aria-label="${k}"><option value="">choose…</option>${opts.map(o => `<option ${sv === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
const nb = (id, k, sv) => `<input class="nb" data-id="${id}" data-k="${k}" inputmode="numeric" value="${esc(sv || '')}" aria-label="${k}">`;
function beakerQ(i) {
  const b = BK[i], id = 'bk' + i, v = peek(id).v;
  const cellLine = b[2] === 's' ? `${nb(id, 'cs', v.cs)} % solute, ${b[1]} % water` : `${b[0]} % solute, ${nb(id, 'cw', v.cw)} % water`;
  const solLine = b[5] === 's' ? `${nb(id, 'ss', v.ss)} % solute, ${b[4]} % water` : `${b[3]} % solute, ${nb(id, 'sw', v.sw)} % water`;
  return `<div class="q ${peek(id).done ? 'done' : ''}" id="q-${id}"><div>${beakerSVG(i)}</div><div>
    <div class="num">Beaker ${i + 1} <span class="done-badge"></span></div>
    <div class="sent small"><b>Cell:</b> ${cellLine}<br><b>Solution:</b> ${solLine}</div>
    <div class="sent">The cell is ${dd(id, 'cell', T, v.cell)}.<br>The solution is ${dd(id, 'sol', T, v.sol)}.<br>Water would move ${dd(id, 'move', MOVE, v.move)} the cell.<br>The cell would ${dd(id, 'size', SIZE, v.size)} in size.</div>
    <div class="btn-row"><button type="button" class="btn primary chk" data-id="${id}" ${peek(id).done ? 'disabled' : ''}>Check (one try)</button><button type="button" class="btn ghost replay ${peek(id).done ? '' : 'hidden'}" data-id="${id}">Replay</button></div><p class="fb" id="fb-${id}" aria-live="polite"></p></div></div>`;
}
function sodaQ() {
  const id = 'soda', v = peek(id).v;
  return `<div class="q wide ${peek(id).done ? 'done' : ''}" id="q-soda"><div>${sodaSVG()}<div class="key-legend"><span style="--c:#22d3ee">water</span><span style="--c:#f97316">glucose from soda</span></div></div><div>
    <div class="num">The soda drinker <span class="done-badge"></span></div>
    <p class="small">This is a picture of a person's cell. She has drunk a lot of soda, so many glucose molecules (orange) are outside her cells. Water molecules (blue) are inside and outside. Water is small and can pass through the semipermeable membrane, but glucose would need a protein channel.</p>
    <div class="sent">This person has ${dd(id, 'cells', T, v.cells)} cells. The solution around her cells is ${dd(id, 'sol', T, v.sol)}. ${dd(id, 'what', ['Water', 'Glucose'], v.what)} will move ${dd(id, 'dir', ['into', 'out of'], v.dir)} her cells, which will cause the cell to ${dd(id, 'res', SIZE, v.res)}. This will continue until the concentration of water inside her cells is ${dd(id, 'until', ['equal to', 'greater than', 'less than'], v.until)} the concentration of water outside her cells.</div>
    <div class="btn-row"><button type="button" class="btn primary chk" data-id="${id}" ${peek(id).done ? 'disabled' : ''}>Check (one try)</button><button type="button" class="btn ghost replay ${peek(id).done ? '' : 'hidden'}" data-id="${id}">Replay</button></div><p class="fb" id="fb-soda" aria-live="polite"></p></div></div>`;
}
function trQ(t, i) {
  const id = t.id, v = peek(id).v, O = TR_OPTS;
  return `<div class="q wide ${peek(id).done ? 'done' : ''}" id="q-${id}"><div>${memSVG(id)}</div><div>
    <div class="num">Diagram ${i + 1} <span class="done-badge"></span></div>
    <div class="sent">This diagram most likely shows ${dd(id, 'rep', O.rep, v.rep)}. The molecules in the picture could be ${dd(id, 'mol', O.mol, v.mol)} molecules. They are crossing the semipermeable membrane through ${dd(id, 'thru', O.thru, v.thru)}, moving from a ${dd(id, 'from', O.hl, v.from)} concentration to a ${dd(id, 'to', O.hl, v.to)} concentration. This process is ${dd(id, 'proc', O.proc, v.proc)} and ${dd(id, 'en', O.en, v.en)} require energy.</div>
    <div class="btn-row"><button type="button" class="btn primary chk" data-id="${id}" ${peek(id).done ? 'disabled' : ''}>Check (one try)</button></div><p class="fb" id="fb-${id}" aria-live="polite"></p></div></div>`;
}

/* ---------------- checking ---------------- */
function answersFor(id) {
  if (id.startsWith('bk')) { const i = +id.slice(2), b = BK[i], a = bkAnswers(b), o = {}; if (b[2] === 's') o.cs = b[0]; else o.cw = b[1]; if (b[5] === 's') o.ss = b[3]; else o.sw = b[4]; return Object.assign(o, a); }
  if (id === 'soda') return SODA;
  return TR.find(t => t.id === id).ans;
}
function hintFor(id, level) {
  if (id.startsWith('bk')) {
    const b = BK[+id.slice(2)], a = bkAnswers(b);
    if (level === 0) return 'Solute + water always adds to 100%. Then compare the % solute inside and outside: the side with <b>more solute</b> is hypertonic, the side with <b>less</b> is hypotonic, and equal is isotonic. Water moves toward the side with more solute.';
    return b[0] === b[3] ? `The cell and solution are both ${b[0]}% solute, so both are isotonic. Water moves in and out equally, and the cell stays the same size.`
      : `The cell is ${b[0]}% solute and the solution is ${b[3]}% solute. The ${b[0] > b[3] ? 'cell' : 'solution'} has more solute, so it is hypertonic. Water moves ${a.move} the cell, so the cell will ${a.size}.`;
  }
  if (id === 'soda') return level === 0 ? 'Which side has more dissolved particles (solute): inside her cells or outside? Water moves toward the side with more solute.' : 'The soda put lots of glucose outside, so the outside is hypertonic and her cells are hypotonic. Water (not glucose) moves out of her cells, so they shrink, until the water concentration inside equals the outside.';
  const t = TR.find(x => x.id === id);
  return level === 0 ? 'Look at the arrow: does it go through the protein or between the phospholipids? Which side has more molecules? Moving from more to fewer is passive.' : t.why;
}
function check(id) {
  const st = it(id); if (st.done) return;
  const ans = answersFor(id), root = $('#q-' + id), fields = $$('[data-id="' + id + '"][data-k]', root), fb = $('#fb-' + id);
  fields.forEach(el => { st.v[el.dataset.k] = el.value.trim(); });
  if (fields.some(el => !el.value.trim())) { fb.className = 'fb bad'; fb.textContent = 'Fill in every blank first. You only get one check, so make sure you are ready.'; save(); return; }
  st.res = {}; fields.forEach(el => { const k = el.dataset.k, val = el.value.trim(); st.res[k] = String(ans[k]) === val || (el.tagName === 'INPUT' && +val === +ans[k]); });
  st.pts = Object.values(st.res).filter(Boolean).length; st.done = true; save();
  if (id.startsWith('bk')) { const i = +id.slice(2); $(`#bksvg${i}`).outerHTML = beakerSVG(i); animateBeaker(i); }
  if (id === 'soda') animateSoda();
  lockItem(id); progress();
  if (doneCount() === N && !S.completedAt) { S.completedAt = new Date().toISOString(); save(); send(true); }
  renderFinish();
}
/* show results for a checked item: green/red blanks, the right answer next to wrong ones, and the explanation */
function lockItem(id) {
  const st = peek(id), root = $('#q-' + id); if (!root || !st.done) return;
  const ans = answersFor(id), n = blanksOf(id);
  $$('[data-id="' + id + '"][data-k]', root).forEach(el => { const k = el.dataset.k, good = st.res ? st.res[k] : true;
    el.disabled = true; el.classList.toggle('y', good); el.classList.toggle('x', !good);
    const nx = el.nextElementSibling; if (nx && nx.classList && nx.classList.contains('fix')) nx.remove();
    if (!good) el.insertAdjacentHTML('afterend', `<span class="fix">${esc(String(ans[k]))}</span>`); });
  root.classList.add('done'); const b = $('.chk', root); if (b) { b.disabled = true; b.textContent = 'Checked'; }
  const rp = $('.replay', root); if (rp) rp.classList.remove('hidden');
  const fb = $('#fb-' + id); fb.className = 'fb ' + (st.pts === n ? 'good' : 'bad');
  const outcome = id.startsWith('bk') ? ` The animation shows what really happens: the cell ${answersFor(id).size === 'stay the same' ? 'stays the same size' : answersFor(id).size + 's'}.` : id === 'soda' ? ' The animation shows water leaving her cell.' : '';
  fb.innerHTML = `<b>${st.pts} of ${n} correct.</b> ${st.pts === n ? '' : 'The correct answers are shown in green next to the red ones. '}${hintFor(id, 1)}${outcome}`;
  $('.done-badge', root).textContent = `✓ ${st.pts}/${n}`;
}

/* ---------------- page ---------------- */
function progress() { const d = doneCount(); $('#progT').textContent = `${d} of ${N} checked · score ${score()}/${TOTAL()}`; $('#progB').style.width = (100 * d / N) + '%'; }
function render() {
  const app = $('#app'), s = S.student;
  if (!S.started) {
    app.innerHTML = `<p class="unit">Biology, Unit 2: Cell Transport · Worksheet</p><h1>Osmosis and Cell Transport Review</h1>
      <p class="muted" style="max-width:62ch">Decide which way water moves in 10 beakers, help a soda drinker's cells, and identify three kinds of transport. Check each one; the pictures move when you get them right. Your work saves on this device.</p>
      <div class="card"><span class="tag">Student information</span><div class="form-grid" style="margin-top:10px">
      <label class="f">First name<input id="fFirst" value="${esc(s.first)}"></label><label class="f">Last name<input id="fLast" value="${esc(s.last)}"></label>
      <label class="f">Period<select id="fPeriod"><option value="">Choose</option>${[1, 2, 3, 4, 5, 6, 7, 8].map(p => `<option ${String(p) === s.period ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <label class="f">Teacher<select id="fTeacher"><option value="">Choose</option>${teacherList().map(t => `<option ${t === s.teacher ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
      <label class="f">Student ID<input id="fSid" value="${esc(s.sid)}" inputmode="numeric"></label></div>
      <p class="fb bad" id="startMsg"></p><div class="btn-row"><button type="button" class="btn primary" id="startBtn">Start the review</button></div></div>`;
    $('#startBtn').addEventListener('click', () => { const v = id => $(id).value.trim(), st = { first: v('#fFirst'), last: v('#fLast'), period: v('#fPeriod'), teacher: v('#fTeacher'), sid: v('#fSid') };
      const miss = Object.entries(st).filter(([, x]) => !x); if (miss.length) { $('#startMsg').textContent = 'Fill in all five boxes.'; return; }
      S.student = st; S.started = true; save(); render(); });
    progress(); return;
  }
  app.innerHTML = `<p class="unit">Biology, Unit 2: Cell Transport · Worksheet · ${esc(s.first)} ${esc(s.last)}, period ${esc(s.period)}</p><h1>Osmosis and Cell Transport Review</h1>
    <div class="card" style="border-color:var(--amber)"><b>How this works:</b> Your answers save on this device as you go, so you can stop and come back later on the same device and browser. Each question has <b>one check</b>, so be sure before you press it. After you check, the right answers and an explanation appear.</div>
    <h2>Part 1: Which way does the water move?</h2><p class="muted small">Fill in the missing percentages (solute + water = 100%). Then compare the cell to the solution around it.</p>
    <div class="beakers">${BK.map((b, i) => beakerQ(i)).join('')}</div>
    <h2>Part 2: Too much soda</h2>${sodaQ()}
    <h2>Part 3: What kind of transport?</h2><p class="muted small">Watch where the molecules go and what they pass through.</p>${TR.map(trQ).join('')}
    <div id="finish"></div>`;
  $$('.chk').forEach(b => b.addEventListener('click', () => check(b.dataset.id)));
  $$('.replay').forEach(b => b.addEventListener('click', () => { const id = b.dataset.id; if (id === 'soda') animateSoda(); else animateBeaker(+id.slice(2)); }));
  $$('[data-k]').forEach(el => ['input', 'change'].forEach(ev => el.addEventListener(ev, () => { if (peek(el.dataset.id).done) return; it(el.dataset.id).v[el.dataset.k] = el.value; save(); flashSaved(); })));
  ITEMS.forEach(lockItem);
  BK.forEach((b, i) => { if (peek('bk' + i).done) animateBeaker(i); }); if (peek('soda').done) animateSoda();
  renderFinish(); progress();
}
function renderFinish() {
  const f = $('#finish'); if (!f) return; const d = doneCount();
  f.innerHTML = `<div class="card"><span class="tag">${d === N ? 'Review complete' : 'Your progress'}</span><h3 style="margin:8px 0 4px">Score: ${score()} out of ${TOTAL()} · ${d} of ${N} questions checked · ${allRight()} all correct</h3>
    <div class="btn-row"><button type="button" class="btn primary" id="sendBtn">Send my score to my teacher</button><button type="button" class="btn ghost" id="csvBtn">Download CSV</button><button type="button" class="btn ghost" id="printBtn">Print</button></div>
    <p class="fb" id="sendMsg" aria-live="polite">${S.sentAt ? `Sent to your teacher ${new Date(S.sentAt).toLocaleString()}.` : ''}</p></div>`;
  $('#sendBtn').addEventListener('click', () => send(false)); $('#csvBtn').addEventListener('click', csv); $('#printBtn').addEventListener('click', () => window.print());
}
function send(auto) {
  const m = $('#sendMsg'), s = S.student;
  const body = new URLSearchParams({ studentId: s.sid, firstName: s.first, lastName: s.last, period: s.period, teacher: s.teacher, activity: ACTIVITY, score: String(score()), total: String(TOTAL()), locks: '0',
    qlabels: ITEMS.map(x => x.startsWith('bk') ? 'Beaker ' + (+x.slice(2) + 1) : x === 'soda' ? 'Soda' : 'Diagram ' + x.slice(2)).join('|'), qpoints: ITEMS.map(x => pts(x)).join('|'), qmax: ITEMS.map(x => blanksOf(x)).join('|'), when: new Date().toString() });
  if (m) { m.className = 'fb'; m.textContent = 'Sending...'; }
  fetch(sheetURL(), { method: 'POST', mode: 'no-cors', body }).then(() => { S.sentAt = new Date().toISOString(); save(); const mm = $('#sendMsg'); if (mm) { mm.className = 'fb good'; mm.textContent = 'Sent! Your teacher will see your score.'; } if (auto) toast('Review complete. Your score was sent to your teacher.'); })
    .catch(() => { const mm = $('#sendMsg'); if (mm) { mm.className = 'fb bad'; mm.textContent = "Couldn't send. Check your internet connection and try again."; } });
}
function csv() {
  const s = S.student, cell = v => { v = String(v == null ? '' : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['Student ID', 'Last Name', 'First Name', 'Period', 'Teacher', 'Activity', 'Score', 'Total', 'Questions Checked', 'Date'], row = [s.sid, s.last, s.first, s.period, s.teacher, ACTIVITY, score(), TOTAL(), `${doneCount()} of ${N}`, new Date().toLocaleString()];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([head.map(cell).join(',') + '\r\n' + row.map(cell).join(',') + '\r\n'], { type: 'text/csv' }));
  a.download = `OsmosisTransportReview_${(s.last || 'student').replace(/\W+/g, '')}_${(s.first || '').replace(/\W+/g, '')}.csv`; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 500);
}

/* ---------------- teacher ---------------- */
const tOv = $('#tOv');
$('#teacherBtn').addEventListener('click', () => { tOv.hidden = false; $('#tLogin').classList.remove('hidden'); $('#tPanel').classList.add('hidden'); $('#tCode').value = ''; $('#tMsg').textContent = ''; });
const tGo = () => { if ($('#tCode').value.trim() !== TEACHER_CODE) { $('#tMsg').textContent = 'That code is not correct.'; return; } $('#tLogin').classList.add('hidden'); $('#tPanel').classList.remove('hidden');
  $('#tInfo').textContent = `${S.student.first ? `Student: ${S.student.first} ${S.student.last}, period ${S.student.period}. ` : ''}${doneCount()} of ${N} checked, score ${score()}/${TOTAL()}.`; };
$('#tGo').addEventListener('click', tGo); $('#tCode').addEventListener('keydown', e => { if (e.key === 'Enter') tGo(); });
$('#tCancel').addEventListener('click', () => { tOv.hidden = true; }); $('#tClose').addEventListener('click', () => { tOv.hidden = true; });
$('#tKey').addEventListener('click', () => { if (!confirm('Fill in every answer on this device? (Use this on a teacher device only.)')) return; tOv.hidden = true; if (!S.started) { S.started = true; S.student = { first: 'Teacher', last: 'Key', period: '-', teacher: 'Austin', sid: '0' }; }
  ITEMS.forEach(id => { const a = answersFor(id), st = it(id); st.res = {}; Object.keys(a).forEach(k => { st.v[k] = String(a[k]); st.res[k] = true; }); st.done = true; st.pts = Object.keys(a).length; }); S.completedAt = S.completedAt || 'key'; save(); render(); });
$('#tReset').addEventListener('click', () => { if (!confirm('Erase this review on this device?')) return; try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); });
render();
})();
</script>
</body>
</html>
