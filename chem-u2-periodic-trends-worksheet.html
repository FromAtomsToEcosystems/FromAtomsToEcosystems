<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Periodic Trends Worksheet | Chemistry Unit 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1424; --bg2:#101b30; --panel:#14203a; --panel2:#1b2a49; --panel3:#223358;
  --line:#26375a; --line2:#35496f;
  --text:#e8eef8; --muted:#a3b4d1; --dim:#7488ab;
  --e:#5fe1ff; --e-glow:rgba(95,225,255,.55); --p:#ff7d66; --n:#aab6cc; --val:#ffd36b; --gain:#ff8fd0;
  --amber:#f6b93b; --good:#4ade80; --bad:#fb7185;
  --c-nonmetal:#45c08f; --c-noble:#a084ff; --c-alkali:#ff8f5e; --c-alkaline:#ffcb5c;
  --c-metalloid:#46c7d8; --c-post:#8ea8cc; --c-halogen:#f477b8;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  --font:"Lexend","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100vh; color:var(--text); font-family:var(--font);
  font-size:17px; line-height:1.6; font-weight:300;
  background:
    radial-gradient(900px 520px at 85% -8%, #1a2d52 0%, transparent 62%),
    radial-gradient(700px 420px at -10% 30%, #13233f 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
b,strong{font-weight:600}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
p{margin:.5em 0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--e);outline-offset:2px;border-radius:6px}
.small{font-size:14px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(12,20,36,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
.brand svg{width:30px;height:30px}
.navtiles{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;flex:1;scrollbar-width:thin}
.top-actions{display:flex;gap:8px}
.top-btn{background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.top-btn:hover{background:var(--panel3)}

/* ---------- element tiles ---------- */
.tile{
  --c:var(--c-nonmetal);
  position:relative; flex:0 0 auto; width:46px; height:52px; border-radius:8px;
  background:var(--panel2);
  background:color-mix(in srgb, var(--c) 20%, var(--panel));
  border:1.5px solid var(--c);
  border-color:color-mix(in srgb, var(--c) 75%, transparent);
  display:grid; place-items:center; font-weight:700; font-size:19px; line-height:1;
  color:var(--text); cursor:pointer; padding:0;
  transition:transform .2s, box-shadow .2s, opacity .2s;
}
.tile .z{position:absolute;top:4px;left:5px;font-size:10px;font-weight:500;color:var(--muted)}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile.current{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c)}
.tile:disabled{cursor:not-allowed;opacity:.32;filter:saturate(.3)}
.tile .ck{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:var(--good);color:#06240f;font-size:11px;display:grid;place-items:center;font-weight:700;opacity:0;transform:scale(.4);transition:.25s}
.tile.done .ck{opacity:1;transform:scale(1)}
.tile.unlocking{animation:unlockPop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes unlockPop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.tile.big{width:74px;height:82px;font-size:32px;border-width:2px;cursor:default}
.tile.big .z{font-size:13px;top:6px;left:8px}
.cat-nonmetal{--c:var(--c-nonmetal)} .cat-noble{--c:var(--c-noble)} .cat-alkali{--c:var(--c-alkali)}
.cat-alkaline{--c:var(--c-alkaline)} .cat-metalloid{--c:var(--c-metalloid)} .cat-post{--c:var(--c-post)} .cat-halogen{--c:var(--c-halogen)}

/* ---------- layout ---------- */
main{max-width:980px;margin:0 auto;padding:22px 18px 80px}
.screen{display:none}
.screen.on{display:block;animation:screenIn .35s ease-out}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:center;gap:18px;margin:8px 0 10px}
.sec-meta{color:var(--muted);font-size:15px;margin:0 0 4px}
.sec-head h2{font-size:clamp(26px,4vw,36px);letter-spacing:-.01em}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin:18px 0}
.card h3{font-size:21px;margin:2px 0 10px}
.tag{display:inline-block;font-size:13px;font-weight:600;color:var(--muted);background:var(--panel2);border-radius:999px;padding:3px 12px;margin-bottom:8px}
.k-read .tag{color:#c3cffc;background:#25305a}
.k-try .tag{color:#0b2630;background:var(--e)}
.k-qc{border:2px solid var(--amber)}
.k-qc .tag{color:#241703;background:var(--amber)}
.read-text{max-width:68ch}

.btn{border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:16px;cursor:pointer;transition:transform .15s, background .2s, opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--e);color:#062430}
.btn.primary:hover:not(:disabled){background:#8eebff}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--text)}
.btn.ghost:hover:not(:disabled){background:var(--panel2)}
.btn.amber{background:var(--amber);color:#241703}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:8px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}

.sec-foot{display:flex;justify-content:space-between;gap:12px;margin-top:22px}

/* word-help chips */
.chip{display:inline;background:rgba(95,225,255,.1);border:0;border-bottom:1.5px dotted var(--e);color:#bff3ff;padding:0 4px;border-radius:4px;cursor:help;font-weight:400}
.chip:hover{background:rgba(95,225,255,.2)}
#pop{position:fixed;z-index:80;max-width:300px;background:var(--panel3);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:15px}
#pop b{display:block;color:var(--e);margin-bottom:2px;text-transform:capitalize}
#pop p{margin:0}

/* particle dots + small tables */
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.dot.p{background:var(--p)} .dot.n{background:var(--n)} .dot.e{background:var(--e);box-shadow:0 0 8px var(--e-glow)}
.mini-table{border-collapse:collapse;margin:14px 0 4px;font-size:15px;min-width:300px}
.mini-table th,.mini-table td{padding:7px 16px 7px 0;border-bottom:1px solid var(--line);text-align:left}
.mini-table th{color:var(--muted);font-weight:500}
.table-scroll{overflow-x:auto}
.rules{display:grid;gap:8px;margin:12px 0}
.rule{background:var(--panel2);border-radius:10px;padding:10px 14px}
.rule small{color:var(--muted)}

/* ---------- Bohr SVG ---------- */
svg.bohr{width:100%;max-width:340px;height:auto;display:block;margin:0 auto;overflow:visible}
.bohr .ring{fill:none;stroke:var(--line2);stroke-width:2}
.bohr .ring.outer{stroke:rgba(255,211,107,.55);stroke-width:2.5}
.bohr .ring-in{animation:ringIn .45s ease-out}
@keyframes ringIn{from{opacity:0;stroke-width:8}to{opacity:1}}
.bohr .nucleus{fill:url(#nucGrad);stroke:rgba(255,125,102,.6);stroke-width:1.5}
.bohr .nt{fill:#fff;font-size:12.5px;font-weight:600;text-anchor:middle;font-family:var(--font)}
.bohr .e{fill:var(--e);filter:drop-shadow(0 0 4px var(--e-glow));transform-box:view-box;transform-origin:0 0;
  transition:transform .55s cubic-bezier(.2,.85,.25,1), opacity .35s, fill .3s}
.bohr .e.val{fill:var(--val);filter:drop-shadow(0 0 5px rgba(255,211,107,.7))}
.bohr .e.gain{fill:var(--gain);filter:drop-shadow(0 0 5px rgba(255,143,208,.75))}
.bohr .ring-out{opacity:0;transition:opacity .45s}
.bohr .bracket{fill:none;stroke:var(--text);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.bohr .charge{fill:var(--text);font-size:28px;font-weight:700;font-family:var(--font)}
.bohr .ion-in{animation:ionIn .6s ease-out}
@keyframes ionIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
.bohr .ionmark{transform-box:view-box;transform-origin:150px 150px}
.ion{white-space:nowrap;font-weight:600}
.ion sup{font-size:.62em;margin-left:1px}
.dot.g{background:var(--gain);box-shadow:0 0 8px rgba(255,143,208,.7)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin:8px 0 0;justify-content:center}
.token .tok-model{display:block;width:70px;margin:0 auto 2px}
.token.model-token{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;font-size:14px}
.big-ion{font-size:clamp(48px,9vw,80px);font-weight:700;line-height:1;text-align:center;margin:8px 0}
.big-ion sup{font-size:.45em;vertical-align:1.1em;margin-left:2px}
.arrow-cap{text-align:center;color:var(--muted);font-size:14px}
.atom-ion{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.atom-ion .arr{font-size:30px;color:var(--amber);font-weight:700}
.atom-ion figure{margin:0;text-align:center}
.atom-ion figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.atom-ion svg{max-width:220px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.meter div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.meter .k{font-size:13px;color:var(--muted)} .meter .v{font-size:24px;font-weight:600}
.meter .v.pos{color:var(--p)} .meter .v.neg{color:var(--e)}
.hero-ion svg{max-width:460px;width:100%;height:auto;display:block;margin:0 auto;overflow:visible}
.hero-ion .travel{transition:transform 1.3s cubic-bezier(.45,0,.25,1)}
.hero-fig.hero-ion svg{max-width:470px}
.hero-ion .ionmark{animation:fadeIn .7s ease-out}
@keyframes fadeIn{from{opacity:0}}
.bohr.static .e{transition:none}
.bohr .zone{fill:rgba(95,225,255,.06);stroke:var(--e);stroke-width:1.5;stroke-dasharray:4 3;cursor:pointer;opacity:.75;transition:fill .2s,opacity .2s}
.bohr .zone:hover,.bohr .zone:focus{fill:rgba(95,225,255,.22);opacity:1;outline:none}
.bohr .zone.bad{stroke:var(--bad);fill:rgba(251,113,133,.25)}
.bohr.pulse .zone{animation:zonePulse 1.6s ease-in-out infinite}
@keyframes zonePulse{50%{fill:rgba(95,225,255,.2)}}
.bohr.mode-add .e{pointer-events:none}
.bohr.mode-erase .zone{pointer-events:none;opacity:.25}
.bohr.mode-erase .e{cursor:pointer}
.bohr.mode-erase .e:hover{fill:var(--bad)}
.bohr .sh{transform-box:view-box;transform-origin:150px 150px}
.bohr.orbit .sh0{animation:spin 14s linear infinite}
.bohr.orbit .sh1{animation:spin 24s linear infinite}
.bohr.orbit .sh2{animation:spin 36s linear infinite}
.bohr.orbit .sh3{animation:spin 50s linear infinite}
.bohr.celebrate .sh{animation:spin 1.1s cubic-bezier(.3,0,.2,1) 1}
@keyframes spin{to{transform:rotate(360deg)}}
.pin circle{fill:var(--panel3);stroke:var(--amber);stroke-width:2}
.pin text{fill:var(--text);font-size:14px;font-weight:700;text-anchor:middle;font-family:var(--font)}
.leader{stroke:var(--amber);stroke-width:1.5;stroke-dasharray:4 4;opacity:.8}

/* ---------- start / hero ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin:12px 0 6px}
.hero h1{font-size:clamp(40px,7vw,72px);letter-spacing:-.025em;font-weight:700;line-height:1.02;margin:6px 0 14px}
.hero .unit{color:var(--muted);margin:0;font-size:16px}
.hero .lede{font-size:19px;max-width:44ch;color:#d3def0}
.hero-fig{position:relative}
.hero-fig svg{max-width:360px}
.hero-cap{text-align:center;color:var(--muted);margin:4px 0 0;font-size:15px;min-height:1.6em}
.hero-cap b{color:var(--text)}
.start-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.start-grid .card{margin:0}
.start-grid + .start-grid{margin-top:18px}
.obj{border-left:4px solid var(--e)}
.std{border-left:4px solid var(--c-noble)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin:8px 0 6px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=password],select,.inp{
  background:var(--bg2);border:1.5px solid var(--line2);border-radius:9px;padding:9px 11px;color:var(--text);font-size:16px;width:100%}
input:focus,select:focus{border-color:var(--e);outline:none}
.form-msg{color:var(--bad);min-height:1.4em;font-size:15px;margin:4px 0}
.welcome{background:var(--panel2);border-radius:12px;padding:14px 16px}

/* goals checklist */
.goals{list-style:none;margin:6px 0;padding:0;display:grid;gap:8px}
.goals li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.box{flex:0 0 22px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;margin-top:1px;transition:.25s}
.ok > .box,.mission.ok .mt > .box{background:var(--good);border-color:var(--good)}
.ok > .box::after,.mission.ok .mt > .box::after{content:"";width:6px;height:11px;border:solid #06240f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ok{color:var(--text)}
.goals li:not(.ok){color:var(--muted)}
.just-ok > .box{animation:tickPop .6s cubic-bezier(.2,1.7,.4,1)}
@keyframes tickPop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* unlock checklist */
.unlock{background:var(--bg2);border-style:dashed}
.unlock h3{font-size:17px;color:var(--muted);font-weight:500}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reqs li{display:flex;gap:10px;align-items:flex-start}
.reqs li:not(.ok){color:var(--muted)}
.unlock.all-done{border-color:var(--good);border-style:solid}

/* ---------- quick checks ---------- */
.qc-q{font-weight:500;font-size:18px;margin:4px 0 12px}
.opts{display:grid;gap:9px}
.opts.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel2);border:1.5px solid var(--line2);border-radius:11px;padding:10px 14px;cursor:pointer;transition:border-color .2s, background .2s, transform .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--e)}
.opt .L{flex:0 0 30px;height:30px;border-radius:8px;background:var(--panel3);display:grid;place-items:center;font-weight:600}
.opts.grid .opt{flex-direction:column;align-items:stretch;padding:10px}
.opts.grid .opt .L{align-self:flex-start}
.opts.grid .opt svg{max-width:170px;stroke-width:1}
.opts.grid .ring{stroke-width:3}
.opt.right{border-color:var(--good);background:rgba(74,222,128,.12)}
.opt.right .L{background:var(--good);color:#06240f}
.opt.wrong{border-color:var(--bad);background:rgba(251,113,133,.1);opacity:.75}
.opt.wrong .L{background:var(--bad);color:#2a0710}
.opt.picked{border-color:var(--e);background:rgba(95,225,255,.12)}
.opt.picked .L{background:var(--e);color:#062430}
.opt:disabled{cursor:default}
body.show-key .opt[data-key]{box-shadow:0 0 0 2px var(--amber)}
body.show-key .opt[data-key]::after{content:"key";margin-left:auto;font-size:12px;color:var(--amber);font-weight:600}
.qc-fb{min-height:1.5em;margin:12px 0 0}
.qc-fb.good{color:#b9f5cf} .qc-fb.bad{color:#ffc2cd}
.qc-fig{margin:4px 0 10px}
.qc-fig svg{max-width:280px;margin:0}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- sorter (tap or drag) ---------- */
.sorter .tray{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;background:var(--bg2);border-radius:12px;border:1px dashed var(--line2)}
.sorter .tray:empty::after{content:"All sorted";color:var(--good);font-size:14px;padding:6px}
.token{background:var(--panel3);border:1.5px solid var(--line2);border-radius:9px;padding:8px 14px;font-weight:500;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s, border-color .15s, background .2s}
.token.sel{border-color:var(--e);background:#20456a;transform:translateY(-2px)}
.token.placed{cursor:default;border-color:var(--good);background:rgba(74,222,128,.14);animation:tickPop .45s}
.token.el-token{display:inline-flex;gap:8px;align-items:center}
.token.el-token .sym{font-weight:700;font-size:18px}
.token.el-token .nm{font-size:13px;color:var(--muted)}
.ghost-token{position:fixed;z-index:90;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.sorter .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.bin{background:var(--panel2);border:1.5px solid var(--line2);border-radius:12px;padding:10px;min-height:96px;cursor:pointer;transition:border-color .2s, background .2s}
.bin.hover,.bin:focus-visible{border-color:var(--e);background:#1f3a5e}
.bin-label{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.bin-drop{display:flex;flex-wrap:wrap;gap:6px}
.sorter.rows .bins{grid-template-columns:1fr;gap:8px}
.sorter.six .bins{grid-template-columns:repeat(3,1fr)}
.sorter.rows .bin{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 10px}
.sorter.rows .bin-label{margin:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;color:var(--text);flex:0 0 32px}
.sorter.rows .bin-drop:empty::before{content:"Drop a label here";color:var(--dim);font-size:14px}
.sort-msg{min-height:1.4em;margin:8px 0 0;font-size:15px}
.label-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.label-fig svg{max-width:360px}

/* ---------- element tile explorer ---------- */
.tile-explore{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.big-tile{--c:var(--c-alkali);width:190px;height:220px;border-radius:16px;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:2.5px solid var(--c);position:relative;display:grid;grid-template-rows:auto 1fr auto auto;padding:12px;gap:2px}
.part{background:transparent;border:2px dashed transparent;border-radius:8px;cursor:pointer;padding:2px 6px;transition:border-color .2s, background .2s}
.part:hover{border-color:rgba(255,255,255,.35)}
.part.seen{border-color:var(--good)}
.part.active{background:rgba(255,255,255,.1);border-color:var(--e)}
.p-z{justify-self:start;font-size:24px;font-weight:600}
.p-sym{font-size:64px;font-weight:700;line-height:1;justify-self:center;align-self:center}
.p-name{font-size:18px;justify-self:center}
.p-mass{font-size:18px;justify-self:center;color:#d5def0}
.part-info{background:var(--panel2);border-radius:12px;padding:14px 16px;min-height:120px}
.part-info h4{margin:0 0 4px;color:var(--e);font-size:17px;font-weight:600}

/* notebook tables */
.notebook{width:100%;border-collapse:collapse;font-size:15px;margin-top:8px}
.notebook th{color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
.notebook td{padding:7px 8px;border-bottom:1px solid var(--line)}
.notebook input{width:76px;text-align:center;padding:7px}
.notebook input.good{border-color:var(--good);background:rgba(74,222,128,.1)}
.notebook input.badv{border-color:var(--bad);background:rgba(251,113,133,.1)}
.mtile{display:inline-grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;background:color-mix(in srgb,var(--c) 18%,var(--panel));border:1.5px solid var(--c);border-radius:8px;padding:4px 9px;font-size:12px;color:var(--muted);line-height:1.25}
.mtile .s{grid-row:span 2;font-size:20px;font-weight:700;color:var(--text)}
.fb-line{min-height:1.4em;margin:10px 0 0}
.fb-line.good{color:#b9f5cf} .fb-line.bad{color:#ffc2cd}

/* ---------- simulators ---------- */
.sim{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.sim-el{display:flex;gap:14px;align-items:center;background:var(--panel2);border-radius:12px;padding:12px}
.sim-el .nm{font-size:20px;font-weight:600}
.sim-el .ar{color:var(--muted);font-size:15px}
.sim-el .ar b{color:var(--e);font-size:18px}
.missions{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.mission{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mission.ok{border-color:var(--good)}
.mission .mt{display:flex;gap:10px;align-items:flex-start}
.mission .mfb{font-size:14px;margin:6px 0 0 32px;min-height:0}
.mission .btn{margin:8px 0 0 32px}
.mission.ok .lockin{display:none}
.counter{font-size:14px;color:var(--muted)}

/* flipchart */
.flip{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;background:var(--bg2);border-radius:14px;padding:16px;margin-top:12px}
.flip-step{color:var(--amber);font-weight:600;font-size:14px;margin:0}
.flip-text{font-size:18px;min-height:3.4em}
.flip-left{background:var(--panel2);border-radius:10px;padding:8px 12px;display:inline-block}
.flip-left b{color:var(--e);font-size:20px}
.flip-dots{display:flex;gap:6px;margin-top:10px}
.flip-dots i{width:9px;height:9px;border-radius:50%;background:var(--line2);transition:.3s}
.flip-dots i.on{background:var(--amber);transform:scale(1.25)}

/* steppers */
.steppers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stp{background:var(--panel2);border-radius:10px;padding:8px;text-align:center}
.stp .lab{font-size:13px;color:var(--muted)}
.stp .row{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.stp button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--panel3);cursor:pointer;font-size:18px;font-weight:600;line-height:1}
.stp output{min-width:26px;font-size:20px;font-weight:600}
.target{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.target .t-name{font-size:20px;font-weight:600}
.progress-pips{display:flex;gap:6px}
.progress-pips i{width:26px;height:8px;border-radius:4px;background:var(--line2);transition:.3s}
.progress-pips i.on{background:var(--good)}

/* builder */
.builder{display:grid;grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.b-fig{background:var(--bg2);border-radius:14px;padding:12px;position:sticky;top:96px}
.b-fig svg{max-width:420px}
.b-note{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:var(--panel2);border:1.5px solid var(--line2);border-radius:999px;padding:6px 14px;font-weight:500;cursor:pointer;font-size:15px}
.tab[aria-selected=true]{border-color:var(--e);background:#1f3a5e}
.tab.ok::after{content:" ✓";color:var(--good);font-weight:700}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:0 0 10px}
legend{padding:0 6px;color:var(--muted);font-size:14px;font-weight:500}
.nuc-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nuc-in label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;border:1px solid var(--line2)}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--e);color:#062430}
.inline-stepper{display:inline-flex;align-items:center;gap:8px}
.inline-stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--panel3);cursor:pointer;font-size:18px;font-weight:600}
.inline-stepper output{font-size:20px;font-weight:600;min-width:24px;text-align:center}
.report{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:7px}
.report li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.report .ic{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.report .y .ic{background:var(--good);color:#06240f}
.report .x .ic{background:var(--bad);color:#2a0710}
.report .w .ic{background:var(--line2);color:var(--muted)}

/* placement game */
.place-prompt{font-size:17px;background:var(--bg2);border-radius:10px;padding:10px 14px;margin:8px 0}
.place-prompt b{color:var(--e)}
.num-fig svg{max-width:280px}
.demo-cap{text-align:center;font-size:16px;min-height:2.8em;margin:6px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}

/* periodic table */
.pt{display:grid;grid-template-columns:repeat(8,minmax(38px,1fr));gap:5px;max-width:460px}
.pt .gh{text-align:center;font-size:12px;color:var(--muted);font-weight:500}
.pt .tile{width:auto;height:48px;font-size:17px}
.pt .tile.same{box-shadow:0 0 0 2px var(--val)}
.pt .tile.seen::before{content:"";position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.pt-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.pt-info{text-align:center;min-height:3em;margin:4px 0 0}
.pt-info b.v{color:var(--val)}
.ans-grid{display:grid;grid-template-columns:repeat(10,minmax(34px,1fr));gap:5px;margin-top:10px}
.ans-grid .tile{width:auto;height:44px;font-size:16px}

/* final check */
.fc-dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.fc-dots button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line2);background:var(--panel2);cursor:pointer;font-size:13px;font-weight:600}
.fc-dots button.ans{background:#1f3a5e;border-color:var(--e)}
.fc-dots button.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--amber)}
.score-big{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.score-big.pass{color:var(--good)} .score-big.fail{color:var(--amber)}
.review-item{border-top:1px solid var(--line);padding:12px 0}
.review-item .yours{color:#ffc2cd} .review-item .right{color:#b9f5cf}
.attempts{font-size:15px;color:var(--muted)}
.lock-note{background:rgba(246,185,59,.1);border:1px solid rgba(246,185,59,.5);border-radius:10px;padding:10px 14px;font-size:15px}
.review-box{background:var(--bg2);border-radius:12px;padding:12px 16px;margin:10px 0}
.review-box li{margin:4px 0}

/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.stat{background:var(--panel2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:600}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;font-size:15px}
.who span{color:var(--muted);display:block;font-size:13px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(6,11,22,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.overlay[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:24px;max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{font-size:22px;margin-bottom:6px}
.lock-modal{border:2px solid var(--amber);text-align:center}
.lock-icon{font-size:44px;line-height:1}
.teacher-tools{display:grid;gap:8px;margin-top:12px}
.drawer{position:fixed;right:16px;top:76px;z-index:60;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.drawer[hidden]{display:none}
.sheetbox{font-size:15px;color:var(--muted);margin:8px 0 0;min-height:1.4em}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:120;background:var(--panel3);border:1px solid var(--good);color:var(--text);border-radius:12px;padding:10px 18px;font-weight:500;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .hero,.start-grid,.sim,.builder,.flip,.two-col,.pt-wrap,.label-wrap,.tile-explore{grid-template-columns:1fr}

  .brand span{display:none}
  .form-grid{grid-template-columns:1fr}

  .ans-grid{grid-template-columns:repeat(5,1fr)}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

}

}

@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
.ws-strip{margin:4px 0 6px}

const GLOSS = {

/* =========================================================
   BOHR MODEL RENDERING
   ========================================================= */
const R = [48, 78, 106, 134], CX = 150, CY = 150, SIDE_ANG = [-90, 0, 90, 180];
function ePos(r, side, k, count, gap = 8.8) {
  let a = SIDE_ANG[side] * Math.PI / 180;
  if (count === 2) { const off = gap / r; a += (k === 0 ? -off : off); }
  return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
}
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }

/* Static Bohr model as an SVG string */
function bohrInner(spec) {
  const radii = spec.radii || R;
  const shells = (spec.shells || []).map(norm);
  const nr = spec.rings != null ? spec.rings : shells.length;
  let s = '';
  for (let i = 0; i < nr; i++) s += `<circle class="ring${spec.val && i === nr - 1 ? ' outer' : ''}" cx="150" cy="150" r="${radii[i]}"/>`;
  if (!spec.noNucleus) {
    const nrad = spec.nucR || 31;
    s += `<circle class="nucleus" cx="150" cy="150" r="${nrad}"/>`;
    const l1 = spec.l1 != null ? spec.l1 : (spec.p == null ? '?' : spec.p + ' p⁺');
    const l2 = spec.l2 != null ? spec.l2 : (spec.n == null ? '' : spec.n + ' n⁰');
    s += `<text class="nt" x="150" y="${l2 ? 146 : 154}">${l1}</text>`;
    if (l2) s += `<text class="nt" x="150" y="163">${l2}</text>`;
  }
  shells.forEach((sides, i) => {
    if (i >= nr) return;
    const er = spec.er || 6.5;
    sides.forEach((cnt, sd) => { for (let k = 0; k < cnt; k++) { const [x, y] = ePos(radii[i], sd, k, cnt, er + 2.6); const g = isGained(spec.orig, i, sd, k, cnt); s += `<circle class="e${g ? ' gain' : ''}${spec.val && i === nr - 1 ? ' val' : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${er}"/>`; } });
  });
  if (spec.charge) s += ionMarks(nr, spec.charge, radii);
  return s;
}
/* which electrons were gained (order index past the neutral atom's count in that shell) */
function isGained(orig, i, sd, k, cnt) {
  if (!orig) return false;
  const j = cnt === 2 && k === 1 ? sd + 4 : sd;
  return i >= orig.length ? true : j >= orig[i];
}
function ionMarks(nr, charge, radii = R) {
  const ro = radii[Math.max(0, nr - 1)] + 16, L = 150 - ro, Rr = 150 + ro, T = 150 - ro, B = 150 + ro, t = 13;
  return `<g class="ionmark"><path class="bracket" d="M${L + t} ${T} H${L} V${B} H${L + t}"/><path class="bracket" d="M${Rr - t} ${T} H${Rr} V${B} H${Rr - t}"/><text class="charge" x="${Rr + 5}" y="${T + 10}">${chargeText(charge)}</text></g>`;
}

  return `<svg viewBox="0 0 300 300" class="bohr static ${cls}" role="img" aria-label="${esc(spec.aria || 'Bohr model')}">${bohrInner(spec)}</svg>`;
}

/* Live, animated Bohr model */
class BohrView {
  constructor(svg, o = {}) {
    this.svg = svg; this.o = o;
    svg.setAttribute('viewBox', '0 0 300 300');
    svg.classList.add('bohr');
    svg.innerHTML = '<g class="rings"></g><g class="zones"></g><g class="nuc"><circle class="nucleus" cx="150" cy="150" r="31"></circle><text class="nt" x="150" y="146"></text><text class="nt" x="150" y="163"></text></g><g class="els"><g class="sh sh0"></g><g class="sh sh1"></g><g class="sh sh2"></g><g class="sh sh3"></g></g><g class="ionwrap"></g>';
    this.ionG = $('.ionwrap', svg); this.ringEls = []; this._ionKey = '';
    this.ringsG = $('.rings', svg); this.zonesG = $('.zones', svg);
    this.nt = $$('.nt', svg); this.shG = $$('.sh', svg);
    this.map = new Map();
    this.st = { p: null, n: null, shells: [], rings: null, val: false, zones: null };
    const act = (e) => {
      const z = e.target.closest && e.target.closest('.zone');
      if (z && this.o.onZone) { this.o.onZone(+z.dataset.shell, +z.dataset.side, z); return true; }
      const el = e.target.closest && e.target.closest('.e');
      if (el && el.dataset.gone) return true;
      if (el && this.o.onElectron) { this.o.onElectron(+el.dataset.shell, +el.dataset.side, el); return true; }
      return false;
    };
    svg.addEventListener('click', act);
    svg.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && act(e)) e.preventDefault(); });
  }
  set(p) { Object.assign(this.st, p); this.draw(); }
  draw() {
    const st = this.st, shells = (st.shells || []).map(norm);
    const nr = st.rings != null ? st.rings : shells.length;
    // rings
    while (this.ringEls.length < nr) {
      const i = this.ringEls.length, c = svgEl('circle', { cx: 150, cy: 150, r: R[i], class: 'ring ring-in' });
      this.ringsG.appendChild(c); this.ringEls.push(c);
    }
    while (this.ringEls.length > nr) { const c = this.ringEls.pop(); c.classList.add('ring-out'); setTimeout(() => c.remove(), REDUCED ? 0 : 500); }
    this.ringEls.forEach((ci, i) => ci.classList.toggle('outer', !!st.val && i === nr - 1));

    const ik = st.charge ? `${nr}|${st.charge}` : '';
    if (ik !== this._ionKey) {
      this._ionKey = ik;
      this.ionG.innerHTML = ik ? ionMarks(nr, st.charge) : '';
      if (ik && !this.o.instant) { const g = this.ionG.firstChild; g.classList.add('ion-in'); }
    }
    // nucleus labels
    const l1 = st.l1 != null ? st.l1 : (st.p == null ? '?' : st.p + ' p⁺');
    const l2 = st.l2 != null ? st.l2 : (st.n == null ? '' : st.n + ' n⁰');
    this.nt[0].textContent = l1; this.nt[1].textContent = l2;
    this.nt[0].setAttribute('y', l2 ? 146 : 154);

    this.zonesG.innerHTML = '';
    if (st.zones) {
      const list = st.zones === 'all' ? [...Array(nr).keys()] : st.zones;
      for (const i of list) {
        if (i >= nr) continue;
        for (let s = 0; s < 4; s++) {
          const [x, y] = ePos(R[i], s, 0, 1);
          this.zonesG.appendChild(svgEl('circle', { cx: x, cy: y, r: 16, class: 'zone', 'data-shell': i, 'data-side': s, tabindex: 0, role: 'button', 'aria-label': `Shell ${i + 1}, ${SIDE[s]}` }));
        }
      }
    }

    for (const [key, el] of this.map) {
      if (!want.has(key)) {
        this.map.delete(key);
        const a = Math.atan2(el._y - 150, el._x - 150);
        el.dataset.gone = '1';
        el.style.opacity = '0';
        el.style.transform = `translate(${el._x + 80 * Math.cos(a)}px,${el._y + 80 * Math.sin(a)}px) scale(.7)`;
        setTimeout(() => el.remove(), 480);
      }
    }
    const instant = REDUCED || this.o.instant;
    for (const [key, [x, y]] of want) {
      const [i, sd] = key.split('-').map(Number);
      let el = this.map.get(key);
      if (!el) {
        el = svgEl('circle', { r: 6.5, cx: 0, cy: 0, class: 'e', 'data-shell': i, 'data-side': sd });
        if (this.o.erasable) { el.setAttribute('tabindex', '0'); el.setAttribute('role', 'button'); el.setAttribute('aria-label', `Electron, shell ${i + 1}, ${SIDE[sd]}`); }
        const a = SIDE_ANG[sd] * Math.PI / 180, rr = R[i] + 46;
        if (!instant) {
          el.style.transform = `translate(${CX + rr * Math.cos(a)}px,${CY + rr * Math.sin(a)}px) scale(.6)`;
          el.style.opacity = '0';
        }
        this.shG[i].appendChild(el);
        this.map.set(key, el);
        if (!instant) el.getBoundingClientRect();
      }
      el._x = x; el._y = y;
      el.style.transform = `translate(${x}px,${y}px)`;
      el.style.opacity = '1';
      el.classList.toggle('val', !!st.val && i === nr - 1);
      const cnt = shells[i][sd], k = +key.split('-')[2];
      el.classList.toggle('gain', isGained(st.orig, i, sd, k, cnt));
    }
  }
  celebrate() {
    if (REDUCED) return;
    this.svg.classList.remove('celebrate'); void this.svg.getBoundingClientRect();
    this.svg.classList.add('celebrate');
    setTimeout(() => this.svg.classList.remove('celebrate'), 1200);
  }
}

    it.done = true; it.tries = 1; it.first = p.rows.every((r, k) => it.pick[k] === r[2]);
    if (doneCount() === N && !W.completedAt) { W.completedAt = new Date().toISOString(); sendToSheet(true); }
    wsave(); render(); window.scrollTo(0, 0);
  });
  $('#wnext').addEventListener('click', () => {
    if (doneCount() === N) { W.screen = 'results'; wsave(); render(); return; }
    let k = P.findIndex((x, i) => i > W.cur && !peek(i).done); if (k < 0) k = P.findIndex((x, i) => !peek(i).done);
    W.cur = k; wsave(); render();
  });
}
function resultsHTML() {
  const s = W.student, d = doneCount(), f = firstCount();
  return `<section class="intro results">
    <p class="sec-meta">Results</p><h2 style="font-size:32px">${d === N ? 'Worksheet complete' : 'Your progress so far'}</h2>
    <section class="card"><span class="tag">Student</span>
      <div class="who"><div><span>Name</span>${esc(s.first + ' ' + s.last)}</div><div><span>Period</span>${esc(s.period)}</div><div><span>Teacher</span>${esc(s.teacher)}</div><div><span>Student ID</span>${esc(s.sid)}</div></div>
      <div class="stats"><div class="stat"><div class="k">Score</div><div class="v">${pts()}/${TOTAL_PTS}</div></div><div class="stat"><div class="k">Problems checked</div><div class="v">${d}/${N}</div></div><div class="stat"><div class="k">All correct</div><div class="v">${f}/${N}</div></div></div>
      <div class="btn-row no-print"><button type="button" class="btn primary" id="sendBtn">Send my score to my teacher</button><button type="button" class="btn ghost" id="csvBtn">Download CSV</button><button type="button" class="btn ghost" id="printBtn">Print</button><button type="button" class="btn ghost" id="backBtn">Back to the worksheet</button></div>
      <p class="sheetbox sheetStatus no-print" aria-live="polite">${W.sentAt ? `Sent to your teacher ${new Date(W.sentAt).toLocaleString()}.` : ''}</p>
    </section>
    <section class="card"><span class="tag">Your problems</span>
      <div class="table-scroll"><table class="mini-table res-table"><thead><tr><th>#</th><th>Problem</th><th>Status</th><th>Points</th></tr></thead><tbody>
      ${P.map((p, i) => { const it = peek(i); return `<tr class="${it.done ? '' : 'todo'}"><td>${i + 1}</td><td>${p.t}</td><td>${it.done ? 'Checked' : 'Not checked'}</td><td>${it.done ? `${ptsOf(i)} / ${rowsOf(i)}` : '—'}</td></tr>`; }).join('')}
      </tbody></table></div></section></section>`;
}
function wireResults() {
  $('#sendBtn').addEventListener('click', () => sendToSheet(false));
  $('#csvBtn').addEventListener('click', downloadCSV);
  $('#printBtn').addEventListener('click', () => window.print());
  $('#backBtn').addEventListener('click', () => { W.screen = 'work'; wsave(); render(); });
}

/* ---------------- Sheets + CSV ---------------- */
function sendToSheet(auto) {
  const msg = t => $$('.sheetStatus').forEach(el => { el.textContent = t; });
  const url = sheetURL(), s = W.student;
  if (!url) { msg("This worksheet isn't connected to your teacher's gradebook sheet yet."); return; }
  const body = new URLSearchParams({ studentId: s.sid, firstName: s.first, lastName: s.last, period: s.period, teacher: s.teacher, activity: ACTIVITY, score: String(pts()), total: String(TOTAL_PTS), locks: '0',
    qlabels: LIST.map((x, i) => 'P' + (i + 1)).join('|'), qpoints: LIST.map((x, i) => ptsOf(i)).join('|'), qmax: LIST.map((x, i) => rowsOf(i)).join('|'), when: new Date().toString() });
  msg('Sending...');
  fetch(url, { method: 'POST', mode: 'no-cors', body })
    .then(() => { W.sentAt = new Date().toISOString(); wsave(); msg('Sent! Your teacher will see your score.'); if (auto) toast('Worksheet complete. Your score was sent to your teacher.'); })
    .catch(() => msg("Couldn't send. Check your internet connection and try again."));
}
function downloadCSV() {
  const s = W.student, cell = v => { v = String(v == null ? '' : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['Student ID', 'Last Name', 'First Name', 'Period', 'Teacher', 'Activity', 'Score', 'Total', 'Problems Checked', 'Date'];
  const row = [s.sid, s.last, s.first, s.period, s.teacher, ACTIVITY, pts(), TOTAL_PTS, `${doneCount()} of ${N}`, new Date().toLocaleString()];
  const blob = new Blob([head.map(cell).join(',') + '\r\n' + row.map(cell).join(',') + '\r\n'], { type: 'text/csv' }), a = document.createElement('a');
  const clean = t => String(t).replace(/[^A-Za-z0-9_-]+/g, '');
  a.href = URL.createObjectURL(blob); a.download = `PeriodicTrendsWorksheet_${clean(s.last)}_${clean(s.first)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ---------------- top bar + teacher ---------------- */
$('#progBtn').addEventListener('click', () => { if (W.screen === 'intro') return; W.screen = 'results'; wsave(); render(); });
const tOv = $('#teacherOv');
$('#teacherBtn').addEventListener('click', () => { tOv.hidden = false; $('#tLogin').classList.remove('hidden'); $('#tPanel').classList.add('hidden'); $('#tCode').value = ''; $('#tMsg').textContent = ''; setTimeout(() => $('#tCode').focus(), 50); });
const tLogin = () => { if ($('#tCode').value.trim().toLowerCase() === TEACHER_CODE) { $('#tLogin').classList.add('hidden'); $('#tPanel').classList.remove('hidden'); $('#tInfo').textContent = `${W.student.first ? `Student: ${W.student.first} ${W.student.last}, period ${W.student.period}. ` : ''}Finished ${doneCount()} of ${N}; ${firstCount()} right on the first check.`; } else { $('#tMsg').textContent = 'That code is not correct.'; shake($('#tCode')); } };
$('#tGo').addEventListener('click', tLogin);
$('#tCode').addEventListener('keydown', e => { if (e.key === 'Enter') tLogin(); });
$('#tCancel').addEventListener('click', () => { tOv.hidden = true; });
$('#tClose').addEventListener('click', () => { tOv.hidden = true; });
$('#tSend').addEventListener('click', () => { tOv.hidden = true; W.screen = 'results'; wsave(); render(); sendToSheet(false); });
$('#tReset').addEventListener('click', () => { if (!confirm('Erase this worksheet on this device?')) return; try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !tOv.hidden) tOv.hidden = true; });

render();
})();

</script>
<script>
/* =========================================================
   CLOUD BACKUP (Saved Student Work sheet)
   Save code = student ID + last name. Work saves on this Chromebook AND in the cloud,
   so a student can sign in on any Chromebook and pick up where they left off.
   ========================================================= */
(() => {
  const KEY = 'fate_chem_trends_worksheet_v3', LESSON = 'Periodic Trends Worksheet';
  const BACKUP_SAVE_URL = 'https://script.google.com/macros/s/AKfycbzs8JVNE3PU_idPirGkpCUq7FrNPB2sNxvd98tRfloumem5HtXHS8XwS2BIdmPz2c2h/exec';
  const saveURL = () => { try { if (typeof SAVE_WEBHOOK_URL !== 'undefined' && SAVE_WEBHOOK_URL) return SAVE_WEBHOOK_URL; } catch (e) {} return BACKUP_SAVE_URL; };
  if (!window.localStorage || !window.fetch) return;
  const realSet = Storage.prototype.setItem;
  const parse = s => { try { return JSON.parse(s); } catch (e) { return null; } };
  const who = st => { const s = st && st.student; if (!s) return null; const sid = String(s.sid || s.id || '').trim(), last = String(s.last || '').trim(); return sid && last ? { sid, last, first: s.first || '', period: s.period || '', teacher: s.teacher || '' } : null; };
  const codeOf = w => (w.sid + '-' + w.last).toLowerCase().replace(/\s+/g, '');
  const cnt = o => o ? Object.values(o).filter(Boolean).length : 0;
  /* a number that only grows as the student does more */
  const prog = st => { if (!st) return 0; let p = 0;
    p += 100 * cnt(st.secDone) + cnt(st.reqs);
    if (st.final) p += 10000 * (st.final.passed ? 1 : 0) + 50 * ((st.final.attempts || []).length);
    if (st.items) p += 10 * Object.values(st.items).filter(x => x && (x.done || x.checked)).length;
    if (st.ans) p += 5 * Object.keys(st.ans).length;
    if (st.submittedAt || st.completedAt || st.screen === 'results') p += 1000;
    return p; };
  const verKey = KEY + '__cloudver';
  let pending = null, lastSent = '', restoring = false;
  /* status chip */
  const chip = document.createElement('div'); chip.className = 'cloudchip'; chip.setAttribute('aria-live', 'polite');
  chip.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:9999;font:600 12px system-ui,sans-serif;padding:5px 10px;border-radius:999px;background:rgba(20,32,52,.85);color:#cfe3ff;pointer-events:none;opacity:0;transition:opacity .3s';
  const showChip = (t, ms = 2500) => { chip.textContent = t; chip.style.opacity = '1'; clearTimeout(showChip.t); showChip.t = setTimeout(() => { chip.style.opacity = '0'; }, ms); };
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(chip)); if (document.body) document.body.appendChild(chip);
  const body = (raw, st, w) => { const ver = Date.now(); realSet.call(localStorage, verKey, String(ver));
    return new URLSearchParams({ code: codeOf(w), lesson: LESSON, data: raw, prog: String(prog(st)), ver: String(ver), studentId: w.sid, lastName: w.last, firstName: w.first, period: w.period, teacher: w.teacher,
      summary: `${prog(st)} progress points` }); };
  function push(now) {
    if (restoring) return;
    const raw = localStorage.getItem(KEY), st = parse(raw), w = who(st);
    if (!w || raw === lastSent) return;
    const b = body(raw, st, w); lastSent = raw;
    if (now && navigator.sendBeacon) { navigator.sendBeacon(saveURL(), b); return; }
    fetch(saveURL(), { method: 'POST', mode: 'no-cors', body: b }).then(() => showChip('☁ Saved to the cloud')).catch(() => { lastSent = ''; showChip('Saved on this Chromebook (cloud not reached)'); });
  }
  function schedule() { clearTimeout(pending); pending = setTimeout(() => push(false), 4000); }
  async function pull(w, localSt) {
    try {
      const r = await fetch(saveURL() + '?code=' + encodeURIComponent(codeOf(w)) + '&lesson=' + encodeURIComponent(LESSON), { cache: 'no-store' });
      const j = await r.json(); if (!j || !j.found || !j.data) return false;
      const cloudSt = parse(j.data); if (!cloudSt) return false;
      if (prog(cloudSt) > prog(localSt)) {
        restoring = true; clearTimeout(pending);
        realSet.call(localStorage, KEY, j.data);
        realSet.call(localStorage, verKey, String(j.ver || Date.now()));
        sessionStorage.setItem('cloud-restored-' + KEY, '1');
        showChip('☁ Found your saved work. Loading it…', 4000);
        setTimeout(() => location.reload(), 700);
        return true;
      }
    } catch (e) { /* offline or blocked: keep working on this Chromebook */ }
    return false;
  }
  /* watch saves to this activity's key */
  Storage.prototype.setItem = function (k, v) {
    if (restoring && this === localStorage && k === KEY) return; /* loading cloud work: don't let the page overwrite it */
    let before = null;
    if (this === localStorage && k === KEY) before = who(parse(localStorage.getItem(KEY)));
    realSet.call(this, k, v);
    if (this !== localStorage || k !== KEY) return;
    const st = parse(v), w = who(st);
    if (!w) return;
    if (!before || codeOf(before) !== codeOf(w)) pull(w, st).then(restored => { if (!restored) schedule(); });
    else schedule();
  };
  window.addEventListener('pagehide', () => push(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') push(true); });
  /* on open: if the cloud has more progress for this student, load it */
  const start = () => {
    if (sessionStorage.getItem('cloud-restored-' + KEY)) { sessionStorage.removeItem('cloud-restored-' + KEY); showChip('☁ Your saved work is loaded'); return; }
    const st = parse(localStorage.getItem(KEY)), w = who(st);
    if (w) pull(w, st);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body></html>
