<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 6 Trashketball | Biology Unit 6</title>
<style>
:root{--bg:#0b1322;--panel:#13203a;--ink:#e8eef8;--mut:#94a3b8;--acc:#f97316;--ok:#4ade80;--bad:#f87171;--gold:#f6b93b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0f1a2e;border-bottom:1px solid #1e2c4a}header h1{margin:0;font-size:22px;flex:1}header .sub{color:var(--mut);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #2b3b5c;background:#1b2a48;color:var(--ink);padding:10px 16px;font-size:17px}button:hover{filter:brightness(1.15)}button.pri{background:var(--acc);border-color:var(--acc);color:#111;font-weight:800}button:disabled{opacity:.4;cursor:default}
.wrap{max-width:1300px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 320px;gap:18px}
.card{background:var(--panel);border:1px solid #1e2c4a;border-radius:18px;padding:22px}
.turn{font-size:18px;color:var(--mut)}.turn b{color:var(--gold);font-size:24px}
.topic{display:inline-block;background:#1e2c4a;border-radius:999px;padding:3px 12px;font-size:14px;color:var(--mut);margin:6px 0}
.q{font-size:32px;font-weight:700;line-height:1.3;margin:10px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opt{font-size:24px;text-align:left;padding:16px;border-radius:14px;background:#0f1a2e;border:2px solid #2b3b5c}.opt b{color:var(--gold);margin-right:8px}
.opt.right{border-color:var(--ok);background:#12301f}.why{margin-top:14px;font-size:20px;color:var(--ok);min-height:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}.timer.low{color:var(--bad)}
.shot{margin-top:16px;padding:16px;border:2px dashed var(--acc);border-radius:14px}.shot h3{margin:0 0 8px;font-size:22px}
.board h2{margin:0 0 10px;font-size:20px}.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:6px;background:#0f1a2e}.team.now{outline:3px solid var(--gold)}
.team .nm{flex:1;font-size:18px;font-weight:700}.team .pts{font-size:26px;font-weight:800;color:var(--gold);min-width:44px;text-align:right}.team .adj{padding:2px 9px;font-size:15px;border-radius:8px}
.bar{height:6px;background:#1e2c4a;border-radius:4px;margin-top:3px}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.setup{max-width:760px;margin:40px auto}.setup label{display:block;margin:10px 0 4px;color:var(--mut)}.setup input{font:inherit;font-size:18px;padding:8px 10px;border-radius:10px;border:1px solid #2b3b5c;background:#0f1a2e;color:var(--ink);width:100%}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rules{color:var(--mut);font-size:16px;line-height:1.5}
.court{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}.court span{padding:6px 14px;border-radius:999px;background:#1e2c4a;font-weight:700}
.win{font-size:42px;font-weight:800;color:var(--gold);text-align:center;margin:20px 0}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.q{font-size:24px}.opt{font-size:19px}}
</style></head><body>
<header><h1>🏀 Unit 6 Trashketball</h1><span class="sub">Ecology</span><button id="bNew">New game</button></header>
<div id="app"></div>
<script>
const Q = [{"t": "Abiotic and Biotic Factors", "q": "A coyote hunts rabbits at night and is active in the chaparral. \"Hunts rabbits at night\" describes its:", "o": ["Niche", "Habitat", "Population", "Biome"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "Which is a <b>density-independent</b> limiting factor?", "o": ["A flood", "Parasites", "Competition for food", "A disease that spreads by contact"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "All the living things in a pond, plus the water, mud, sunlight, and air, make up a:", "o": ["Ecosystem", "Population", "Community", "Organism"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "Which list is in order from <b>smallest</b> to <b>largest</b>?", "o": ["Organism, population, community, ecosystem, biome, biosphere", "Biosphere, biome, ecosystem, community, population, organism", "Organism, community, population, ecosystem, biosphere, biome", "Population, organism, ecosystem, community, biome, biosphere"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "Which is an <b>abiotic</b> factor in a pond?", "o": ["The temperature of the water", "Algae", "A frog", "Bacteria in the mud"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "All the coast redwood trees in one state park make up a:", "o": ["Population", "Ecosystem", "Biosphere", "Community"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "What is a <b>limiting factor</b>?", "o": ["Any factor that limits how many organisms can live in an area", "The largest population in a community", "A factor that only affects plants", "Any living thing in an ecosystem"], "why": ""}, {"t": "Abiotic and Biotic Factors", "q": "In the <b>optimal range</b> for a factor, an organism:", "o": ["Grows and reproduces the most", "Moves to a new biome", "Cannot survive", "Lives but reproduces very little"], "why": ""}, {"t": "The Carbon Cycle", "q": "How do decomposers return carbon to the air?", "o": ["They break down dead things, and their cellular respiration releases CO₂", "They bury the carbon in rock", "They do photosynthesis", "They turn carbon into oxygen"], "why": ""}, {"t": "The Carbon Cycle", "q": "About how much CO₂ was in the air at Mauna Loa in 1958?", "o": ["About 315 ppm", "About 5 ppm", "About 1,000 ppm", "About 420 ppm"], "why": ""}, {"t": "The Carbon Cycle", "q": "How long does it take for fossil fuels to form?", "o": ["Millions of years", "About one year", "About 100 years", "A few days"], "why": ""}, {"t": "The Carbon Cycle", "q": "Which of these is part of the <b>slow</b> carbon cycle?", "o": ["Shells on the sea floor slowly becoming limestone", "A rabbit breathing out", "A log being decomposed", "A leaf doing photosynthesis"], "why": ""}, {"t": "The Carbon Cycle", "q": "Which process puts CO₂ <b>into</b> the air when wood or gasoline is burned?", "o": ["Combustion", "Fossil fuel formation", "Photosynthesis", "Consumption"], "why": ""}, {"t": "The Carbon Cycle", "q": "Carbon dissolved in seawater is part of which reservoir?", "o": ["Hydrosphere", "Biosphere", "Atmosphere", "Geosphere"], "why": ""}, {"t": "The Carbon Cycle", "q": "Why is carbon found in every living thing?", "o": ["Carbohydrates, lipids, proteins, and nucleic acids are all built on carbon", "Living things breathe in carbon atoms to grow", "Water is made of carbon", "Carbon is only found in bones"], "why": ""}, {"t": "The Carbon Cycle", "q": "Which process takes CO₂ <b>out</b> of the air?", "o": ["Photosynthesis", "Cellular respiration", "Decomposition", "Combustion"], "why": ""}, {"t": "Ecological Relationships", "q": "Gause grew two kinds of <i>Paramecium</i> together with limited food, and one kind died out. This shows:", "o": ["Competitive exclusion", "Herbivory", "Mutualism", "Resource partitioning"], "why": ""}, {"t": "Ecological Relationships", "q": "Which relationship is written as <b>+/+</b>?", "o": ["Mutualism", "Commensalism", "Competition", "Parasitism"], "why": ""}, {"t": "Ecological Relationships", "q": "A barn owl and a red-tailed hawk hunt the same mice in one field. What kind of relationship is this?", "o": ["Interspecific competition", "Intraspecific competition", "Commensalism", "Parasitism"], "why": ""}, {"t": "Ecological Relationships", "q": "In the simulation, fish in a school were caught less often than lone fish. Which idea best explains this?", "o": ["The confusion effect: the predator had trouble picking out one fish", "Fish in schools are poisonous", "The predator only hunts lone fish", "Schools are always smaller"], "why": ""}, {"t": "Ecological Relationships", "q": "Two male elk fight over the same group of females. What kind of relationship is this?", "o": ["Intraspecific competition", "Predation", "Mutualism", "Interspecific competition"], "why": ""}, {"t": "Ecological Relationships", "q": "Barnacles ride on a gray whale and get to water full of food. The whale is not affected. This is:", "o": ["Commensalism", "Predation", "Mutualism", "Parasitism"], "why": ""}, {"t": "Ecological Relationships", "q": "What does the symbol <b>0</b> mean in a +/−/0 code?", "o": ["The organism is not helped or harmed", "The organism is harmed", "The organism benefits", "The organism is killed"], "why": ""}, {"t": "Ecological Relationships", "q": "A sea urchin eats kelp. What kind of relationship is this?", "o": ["Herbivory", "Predation", "Commensalism", "Mutualism"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "Which statement is true?", "o": ["Matter cycles, but energy flows one way and leaves as heat", "Neither matter nor energy moves in an ecosystem", "Energy cycles, but matter flows one way", "Both matter and energy are recycled"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "Why do food chains rarely have more than 4 or 5 levels?", "o": ["Too little energy is left at the top to support another level", "There are not enough plants", "Decomposers eat the top predators", "Animals at the top are too fast to catch"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "In a food chain, what does an arrow show?", "o": ["The direction energy moves, from the food to the eater", "The direction from the eater to its food", "Which way the eater runs", "Which animal is bigger"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "A coyote eats rabbits, mice, and toyon berries. What kind of consumer is it?", "o": ["Omnivore", "Carnivore", "Producer", "Herbivore"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "What is a <b>producer</b>?", "o": ["An organism that makes its own food, usually by photosynthesis", "An organism that breaks down dead matter", "An organism that eats only plants", "An animal at the top of a food web"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "What is <b>biomagnification</b>?", "o": ["A poison that does not break down gets more concentrated at each higher trophic level", "A microscope that makes cells look bigger", "Plants making more food in sunlight", "Animals growing bigger at the top of a food chain"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "grasses → grasshopper → lizard → hawk. What trophic level is the <b>lizard</b>?", "o": ["Secondary consumer (level 3)", "Producer (level 1)", "Primary consumer (level 2)", "Tertiary consumer (level 4)"], "why": ""}, {"t": "Food Webs and Energy Pyramids", "q": "About what percent of energy passes from one trophic level to the next?", "o": ["About 10%", "100%", "About 50%", "About 90%"], "why": ""}, {"t": "Population Growth", "q": "About how many people live on Earth today?", "o": ["About 8 billion", "About 800 billion", "About 1 billion", "About 80 million"], "why": ""}, {"t": "Population Growth", "q": "Which is a <b>density-independent</b> factor?", "o": ["A wildfire", "Competition for food", "Disease spreading in a crowded herd", "Predators catching more prey"], "why": ""}, {"t": "Population Growth", "q": "What is <b>emigration</b>?", "o": ["Individuals moving out of a population", "Individuals dying of old age", "Individuals being born", "Individuals moving into a population"], "why": ""}, {"t": "Population Growth", "q": "A population of 500 mice grows by 50 in one year. What is the <b>growth rate</b>?", "o": ["10% per year", "550% per year", "5% per year", "50% per year"], "why": ""}, {"t": "Population Growth", "q": "What shape does <b>logistic growth</b> make on a graph?", "o": ["An S curve that levels off at K", "A J curve that keeps getting steeper", "A curve that goes up and crashes", "A straight line going down"], "why": ""}, {"t": "Population Growth", "q": "Which is a <b>density-dependent</b> factor?", "o": ["Competition for nesting space", "A hurricane", "A volcano erupting", "A freezing winter"], "why": ""}, {"t": "Population Growth", "q": "Bacteria double every 20 minutes. Starting with 1, how many are there after <b>1 hour</b>?", "o": ["8", "60", "6", "3"], "why": ""}, {"t": "Population Growth", "q": "A 20 km² meadow has 100 rabbits. What is the <b>population density</b>?", "o": ["5 rabbits per km²", "2,000 rabbits per km²", "20 rabbits per km²", "120 rabbits per km²"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "On a predator and prey graph, the predator peaks usually come:", "o": ["A little after the prey peaks", "Only once, and never again", "A little before the prey peaks", "At exactly the same time as the prey peaks"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "A wetland has 40 kinds of birds, 12 kinds of fish, and many kinds of plants. This describes its:", "o": ["Species diversity", "Ecosystem diversity", "Succession", "Genetic diversity"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "Ochre sea stars of one species come in orange, purple, and brown. This is an example of:", "o": ["Genetic diversity", "Ecosystem diversity", "Species diversity", "An invasive species"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "A fire burns a hillside, but the soil is left. Grasses, then shrubs, grow back. This is:", "o": ["Secondary succession", "Overharvesting", "Primary succession", "A trophic cascade"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "What is a <b>predator</b>?", "o": ["An organism that hunts and eats other organisms", "A plant that makes its own food", "An organism that is hunted and eaten", "A species brought to a new place"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "In what years were gray wolves brought back into Yellowstone National Park?", "o": ["1995 and 1996", "1925 and 1926", "2015 and 2016", "1850 and 1851"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "The Hudson's Bay Company records show snowshoe hare and lynx numbers rising and falling about every:", "o": ["10 years", "1,000 years", "100 years", "1 year"], "why": ""}, {"t": "Predators, Prey, and Biodiversity", "q": "What is a <b>keystone species</b>?", "o": ["A species with a much bigger effect on its ecosystem than its numbers suggest", "The most common species in an ecosystem", "The largest animal in an ecosystem", "A species that was brought to a new place"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>____ that starts fast, then slows down and levels off at carrying capacity. The graph is S-shaped.</i>", "o": ["logistic growth", "limiting factor", "carrying capacity", "density-independent factor"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>A plant in sunlight takes in CO₂ from the air and makes glucose. It takes carbon out of the air.</i>", "o": ["photosynthesis", "fossil fuels", "combustion", "cellular respiration"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>A feeding step in a food chain. Producers are ____ 1, primary consumers are ____ 2, and so on.</i>", "o": ["trophic level", "energy pyramid", "herbivore", "decomposer"], "why": ""}, {"t": "Vocabulary", "q": "Which vocabulary word matches this definition?<br><i>The slow, step-by-step change in the species living in an area after a disturbance.</i>", "o": ["succession", "predator", "trophic cascade", "prey"], "why": ""}];
const KEY = 'fate_biol_u6_trashketball_v1';
let S = load() || null, tick = null;
function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = s => document.querySelector(s);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setup() {
  clearInterval(tick);
  $('#app').innerHTML = `<div class="setup card"><h2>Set up the game</h2>
    <p class="rules"><b>How to play:</b> Teams take turns. Read the question aloud and start the timer. If the team answers correctly, they earn <b>1 point</b> and one shot at the trash can: tape lines on the floor for <b>1, 2, and 3 points</b>. A wrong answer passes the turn. Highest score wins.</p>
    <label>How many teams?</label><input id="nT" type="number" min="2" max="8" value="8">
    <label>Seconds per question</label><input id="nS" type="number" min="10" max="180" value="45">
    <label>Team names (optional)</label><div class="names" id="names"></div>
    <div class="row"><button class="pri" id="go">Start game</button></div></div>`;
  const names = () => { const n = Math.max(2, Math.min(8, +$('#nT').value || 8)); $('#names').innerHTML = Array.from({ length: n }, (_, i) => `<input data-i="${i}" placeholder="Group ${i + 1}">`).join(''); };
  names(); $('#nT').addEventListener('input', names);
  $('#go').addEventListener('click', () => {
    const n = Math.max(2, Math.min(8, +$('#nT').value || 8));
    const teams = Array.from({ length: n }, (_, i) => ({ name: (document.querySelector(`#names input[data-i="${i}"]`).value || '').trim() || `Group ${i + 1}`, pts: 0 }));
    S = { teams, turn: 0, order: shuffle(Q.map((_, i) => i)), qi: 0, phase: 'ask', secs: Math.max(10, +$('#nS').value || 45), left: null, asked: 0 };
    save(); play();
  });
}
function cur() { return Q[S.order[S.qi % S.order.length]]; }
function play() {
  clearInterval(tick);
  const q = cur(), t = S.teams[S.turn], shown = S.phase !== 'ask', max = Math.max(1, ...S.teams.map(x => x.pts));
  $('#app').innerHTML = `<div class="wrap"><div class="card">
    <div class="turn">Up now: <b>${t.name}</b> · Question ${S.asked + 1}</div><span class="topic">${q.t}</span>
    <div class="q">${q.q}</div>
    <div class="opts">${q.o.map((o, k) => `<div class="opt ${shown && k === 0 ? 'right' : ''}"><b>${'ABCD'[k]}</b>${o}</div>`).join('')}</div>
    <div class="why">${shown ? '✓ ' + q.o[0] + (q.why ? ' · ' + q.why : '') : ''}</div>
    <div class="row"><span class="timer" id="tm">${S.left ?? S.secs}</span><button id="tGo">Start timer</button><button id="show" ${shown ? 'disabled' : ''}>Show answer</button>
      ${S.phase === 'shown' ? `<button class="pri" id="ok">✓ Correct (+1)</button><button id="no">✗ Wrong (pass)</button>` : ''}</div>
    ${S.phase === 'shoot' ? `<div class="shot"><h3>🏀 ${t.name} takes a shot!</h3><div class="court"><span>1-pt line</span><span>2-pt line</span><span>3-pt line</span></div>
      <div class="row"><button data-s="0">Missed</button><button class="pri" data-s="1">Made 1-pt</button><button class="pri" data-s="2">Made 2-pt</button><button class="pri" data-s="3">Made 3-pt</button></div></div>` : ''}
    </div>
    <div class="card board"><h2>Scoreboard</h2>${S.teams.map((x, i) => `<div class="team ${i === S.turn ? 'now' : ''}"><div style="flex:1"><div class="nm">${x.name}</div><div class="bar"><i style="width:${x.pts / max * 100}%"></i></div></div><button class="adj" data-a="${i}" data-d="-1">−</button><button class="adj" data-a="${i}" data-d="1">+</button><span class="pts">${x.pts}</span></div>`).join('')}
      <div class="row"><button id="skip">Skip question</button><button id="end">End game</button></div></div></div>`;
  // ---- order the options so the correct one is not always A: shuffle positions per question but keep the "right" index
  const optEls = [...document.querySelectorAll('.opt')], perm = permFor(S.order[S.qi % S.order.length]);
  const box = document.querySelector('.opts'); perm.forEach((k, pos) => { const el = optEls[k]; el.querySelector('b').textContent = 'ABCD'[pos]; box.appendChild(el); });
  if (shown) $('.why').textContent = '✓ ' + 'ABCD'[perm.indexOf(0)] + '. ' + q.o[0] + (q.why ? ' · ' + q.why : '');
  $('#tGo').addEventListener('click', () => { clearInterval(tick); if (S.left == null || S.left <= 0) S.left = S.secs; tick = setInterval(() => { S.left--; const e = $('#tm'); if (!e) return clearInterval(tick); e.textContent = Math.max(0, S.left); e.classList.toggle('low', S.left <= 10); if (S.left <= 0) clearInterval(tick); }, 1000); });
  $('#show').addEventListener('click', () => { clearInterval(tick); S.phase = 'shown'; save(); play(); });
  const okb = $('#ok'); if (okb) okb.addEventListener('click', () => { t.pts += 1; S.phase = 'shoot'; save(); play(); });
  const nob = $('#no'); if (nob) nob.addEventListener('click', () => next());
  document.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => { t.pts += +b.dataset.s; next(); }));
  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => { const x = S.teams[+b.dataset.a]; x.pts = Math.max(0, x.pts + +b.dataset.d); save(); play(); }));
  $('#skip').addEventListener('click', () => { S.qi++; S.phase = 'ask'; S.left = null; save(); play(); });
  $('#end').addEventListener('click', () => { if (confirm('End the game and show the winner?')) finish(); });
}
function permFor(i) { const p = [0, 1, 2, 3].slice(0, Q[i].o.length); let r = (i * 7 + 3) % p.length; const a = p.slice(1); a.splice(r, 0, 0); return a; }
function next() { S.turn = (S.turn + 1) % S.teams.length; S.qi++; S.asked++; S.phase = 'ask'; S.left = null; save(); play(); }
function finish() {
  clearInterval(tick); const rank = S.teams.slice().sort((a, b) => b.pts - a.pts), top = rank[0].pts, winners = rank.filter(x => x.pts === top).map(x => x.name);
  $('#app').innerHTML = `<div class="setup card"><div class="win">🏆 ${winners.join(' & ')} ${winners.length > 1 ? 'tie' : 'wins'}!</div>${rank.map((x, i) => `<div class="team"><span class="nm">${i + 1}. ${x.name}</span><span class="pts">${x.pts}</span></div>`).join('')}<div class="row"><button class="pri" id="again">New game</button><button id="back">Back to the game</button></div></div>`;
  $('#again').addEventListener('click', () => { S = null; save(); setup(); }); $('#back').addEventListener('click', play);
}
document.getElementById('bNew').addEventListener('click', () => { if (!S || confirm('Start a new game? The current scores will be cleared.')) { S = null; localStorage.removeItem(KEY); setup(); } });
S ? play() : setup();
</script></body></html>
