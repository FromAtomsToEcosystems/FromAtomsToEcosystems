<style>
:root{--c:#3f7a2e;--soft:#e8f2e3;--ink:#1d2b36;--muted:#56666f;--line:#d3dedb;--paper:#f3f6f5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Atkinson Hyperlegible",Segoe UI,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff}
.bar b{font:800 17px "Bricolage Grotesque",Segoe UI,sans-serif}.bar button{font:inherit;font-weight:700;border:1px solid #64748b;background:transparent;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.sheet{background:#fff;max-width:1100px;margin:16px auto;padding:18px 22px;border:1px solid var(--line);border-radius:12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 20px;border-bottom:3px solid var(--c);padding-bottom:8px}
.kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
h1{font:800 26px/1.1 "Bricolage Grotesque",Segoe UI,sans-serif;margin:2px 0 0}
.who{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}.who span{border-bottom:1px solid #94a3b8;min-width:150px;padding-bottom:2px}.who span.s{min-width:60px}
.dir{font-size:14px;margin:8px 0 6px;color:#334155}
.map{overflow-x:auto}.pg+.pg{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}.map svg{display:block;width:100%;height:auto;min-width:760px;max-height:calc(100vh - 40px)}
.keytag{display:none;color:#9a3412;font-weight:700;font-size:14px}
body.key .keytag{display:inline}body.key .blank{display:none}body:not(.key) .ans{display:none}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.ov[hidden]{display:none}
.card{background:#fff;border-radius:14px;padding:20px;max-width:380px;width:100%}.card h2{margin:0 0 8px;font:800 20px "Bricolage Grotesque",Segoe UI,sans-serif}
.card input{width:100%;font:inherit;padding:8px 10px;border:1px solid #94a3b8;border-radius:8px}.card .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.card button{font:inherit;font-weight:700;border-radius:8px;padding:8px 12px;border:1px solid #94a3b8;background:#fff;cursor:pointer}.card button.p{background:var(--c);color:#fff;border-color:var(--c)}
.sheet{max-width:min(1100px,100%)}@media (max-width:600px){.sheet{margin:8px;padding:12px}.who span{min-width:90px}}
.msg{color:#b91c1c;font-size:14px;min-height:1.2em;margin:6px 0 0}
@page{size:letter landscape;margin:0.35in}
@media print{body{background:#fff}.bar,.ov{display:none!important}.sheet{border:0;margin:0;padding:0;max-width:none}.map{overflow:visible}.map svg{min-width:0;max-height:6.15in}.pg+.pg svg{max-height:7.2in}.pg+.pg{break-before:page;border:0;margin:0;padding:0}.pg{break-inside:avoid}h1{font-size:22px}}

<text x="1024.0" y="357.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">mutualism</text><text x="1024.0" y="372.0" text-anchor="middle" font-size="12" fill="#9a3412">Both species benefit.</text><rect x="908" y="448.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="1024.0" y="469.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">parasitism</text><text x="1024.0" y="484.0" text-anchor="middle" font-size="12" fill="#9a3412">One benefits and the other is</text><text x="1024.0" y="498.4" text-anchor="middle" font-size="12" fill="#9a3412">harmed.</text><rect x="262" y="628.0" width="190" height="76" rx="22" fill="#e8f2e3" stroke="#3f7a2e" stroke-width="2.4"/><rect x="272" y="636.0" width="11" height="11" rx="2" fill="#fff" stroke="#3f7a2e" stroke-width="1.6"/><text x="288" y="646.0" font-size="11" font-weight="700" fill="#3f7a2e" letter-spacing=".5">LESSON 6</text><text x="357.0" y="666.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Food webs and energy</text><text x="357.0" y="683.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">pyramids</text><rect x="564" y="560.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="680.0" y="581.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">producer</text><text x="680.0" y="596.0" text-anchor="middle" font-size="12" fill="#9a3412">Makes its own food from sunlight,</text><text x="680.0" y="610.4" text-anchor="middle" font-size="12" fill="#9a3412">like a plant.</text><rect x="564" y="672.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="680.0" y="693.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">trophic level</text><text x="680.0" y="708.0" text-anchor="middle" font-size="12" fill="#9a3412">A feeding step in a food chain.</text><rect x="908" y="672.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="1024.0" y="693.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">energy pyramid</text><text x="1024.0" y="708.0" text-anchor="middle" font-size="12" fill="#9a3412">Shows only about 10% of energy</text><text x="1024.0" y="722.4" text-anchor="middle" font-size="12" fill="#9a3412">passes to the next level.</text></svg></div></div>

<div class="ov" id="tOv" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="tH">
 <h2 id="tH">Teacher</h2><div id="tLogin"><label for="tCode">Teacher code</label><input id="tCode" type="password" autocomplete="off"><p class="msg" id="tMsg"></p>
 <div class="row"><button class="p" type="button" id="tGo">Open</button><button type="button" class="tX">Close</button></div></div>
 <div id="tTools" hidden><div class="row"><button class="p" type="button" id="pBlank">Print student copy</button><button class="p" type="button" id="pKey">Print answer key</button><button type="button" id="sKey">Show answer key</button><button type="button" class="tX">Close</button></div></div>
</div></div>
<script>
(function(){const $=s=>document.querySelector(s),ov=$('#tOv');
const close=()=>{ov.hidden=true;};
$('#tBtn').addEventListener('click',()=>{ov.hidden=false;if(!$('#tTools').hidden)return;$('#tCode').value='';$('#tMsg').textContent='';setTimeout(()=>$('#tCode').focus(),30);});
document.querySelectorAll('.tX').forEach(b=>b.addEventListener('click',close));
const go=()=>{if($('#tCode').value.trim().toLowerCase()==='teacher007'){$('#tLogin').hidden=true;$('#tTools').hidden=false;}else $('#tMsg').textContent='Code not recognized.';};
$('#tGo').addEventListener('click',go);$('#tCode').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const pr=k=>{document.body.classList.toggle('key',k);close();setTimeout(()=>{window.print();},80);};
$('#pBlank').addEventListener('click',()=>pr(false));$('#pKey').addEventListener('click',()=>pr(true));
$('#sKey').addEventListener('click',()=>{const k=!document.body.classList.contains('key');document.body.classList.toggle('key',k);$('#sKey').textContent=k?'Hide answer key':'Show answer key';close();});
window.addEventListener('afterprint',()=>{});
})();
</script></body></html>
