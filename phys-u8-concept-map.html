ves spreading around edges or</text><text x="680.0" y="162.4" text-anchor="middle" font-size="12" fill="#9a3412">through openings.</text><rect x="262" y="348.0" width="190" height="76" rx="22" fill="#e6eef9" stroke="#2f5d9b" stroke-width="2.4"/><rect x="272" y="356.0" width="11" height="11" rx="2" fill="#fff" stroke="#2f5d9b" stroke-width="1.6"/><text x="288" y="366.0" font-size="11" font-weight="700" fill="#2f5d9b" letter-spacing=".5">LESSONS 6 AND 7</text><text x="357.0" y="394.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sound</text><rect x="564" y="224.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="680.0" y="245.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">pitch</text><text x="680.0" y="260.0" text-anchor="middle" font-size="12" fill="#9a3412">How high or low a sound is.</text><rect x="564" y="336.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="680.0" y="357.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">resonance</text><text x="680.0" y="372.0" text-anchor="middle" font-size="12" fill="#9a3412">An object vibrates strongly at its</text><text x="680.0" y="386.4" text-anchor="middle" font-size="12" fill="#9a3412">natural frequency.</text><rect x="564" y="448.0" width="232" height="100" rx="26" fill="#fff" stroke="#334155" stroke-width="1.6"/><text x="680.0" y="469.0" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Doppler effect</text><text x="680.0" y="484.0" text-anchor="middle" font-size="12" fill="#9a3412">Pitch rises as a source comes closer</text><text x="680.0" y="498.4" text-anchor="middle" font-size="12" fill="#9a3412">and drops as it leaves.</text></svg></div></div>

<div class="ov" id="tOv" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="tH">
 <h2 id="tH">Teacher</h2><div id="tLogin"><label for="tCode">Teacher code</label><input id="tCode" type="password" autocomplete="off"><p class="msg" id="tMsg"></p>
 <div class="row"><button class="p" type="button" id="tGo">Open</button><button type="button" class="tX">Close</button></div></div>
 <div id="tTools" hidden><div class="row"><button class="p" type="button" id="pBlank">Print student copy</button><button class="p" type="button" id="pKey">Print answer key</button><button type="button" id="sKey">Show answer key</button><button type="button" class="tX">Close</button></div></div>
</div></div>
<script>
(function(){const $=s=>document.querySelector(s),ov=$('#tOv');
const close=()=>{ov.hidden=true;};
$('#tBtn').addEventListener('click',()=>{ov.hidden=false;if(!$('#tTools').hidden)return;$('#tCode').value='';$('#tMsg').textContent='';setTimeout(()=>$('#tCode').focus(),30);});
document.querySelectorAll('.tX').forEach(b=>b.addEventListener('click',close));
const go=()=>{if($('#tCode').value.trim().toLowerCase()==='teacher007'){$('#tLogin').hidden=true;$('#tTools').hidden=false;}else $('#tMsg').textContent='Code not recognized.';};
$('#tGo').addEventListener('click',go);$('#tCode').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const pr=k=>{document.body.classList.toggle('key',k);close();setTimeout(()=>{window.print();},80);};
$('#pBlank').addEventListener('click',()=>pr(false));$('#pKey').addEventListener('click',()=>pr(true));
$('#sKey').addEventListener('click',()=>{const k=!document.body.classList.contains('key');document.body.classList.toggle('key',k);$('#sKey').textContent=k?'Hide answer key':'Show answer key';close();});
window.addEventListener('afterprint',()=>{});
})();
</script></body></html>
