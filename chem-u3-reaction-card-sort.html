<script>
/* =========================================================
   CLOUD BACKUP (Saved Student Work sheet)
   Save code = student ID + last name. Work saves on this Chromebook AND in the cloud,
   so a student can sign in on any Chromebook and pick up where they left off.
   ========================================================= */
(() => {
  const KEY = 'fate_chem_reaction_card_sort_v1', LESSON = 'Reaction Type Card Sort';
  const BACKUP_SAVE_URL = 'https://script.google.com/macros/s/AKfycbzs8JVNE3PU_idPirGkpCUq7FrNPB2sNxvd98tRfloumem5HtXHS8XwS2BIdmPz2c2h/exec';
  const saveURL = () => { try { if (typeof SAVE_WEBHOOK_URL !== 'undefined' && SAVE_WEBHOOK_URL) return SAVE_WEBHOOK_URL; } catch (e) {} return BACKUP_SAVE_URL; };
  if (!window.localStorage || !window.fetch) return;

  const parse = s => { try { return JSON.parse(s); } catch (e) { return null; } };

  const codeOf = w => (w.sid + '-' + w.last).toLowerCase().replace(/\s+/g, '');
  const cnt = o => o ? Object.values(o).filter(Boolean).length : 0;
  /* a number that only grows as the student does more */
  const prog = st => { if (!st) return 0; let p = 0;
    p += 100 * cnt(st.secDone) + cnt(st.reqs);
    if (st.final) p += 10000 * (st.final.passed ? 1 : 0) + 50 * ((st.final.attempts || []).length);
    if (st.items) p += 10 * Object.values(st.items).filter(x => x && (x.done || x.checked)).length;
    if (st.ans) p += 5 * Object.keys(st.ans).length;
    if (st.submittedAt || st.completedAt || st.screen === 'results') p += 1000;
    return p; };
  const verKey = KEY + '__cloudver';
  let pending = null, lastSent = '', restoring = false;
  /* status chip */
  const chip = document.createElement('div'); chip.className = 'cloudchip'; chip.setAttribute('aria-live', 'polite');
  chip.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:9999;font:600 12px system-ui,sans-serif;padding:5px 10px;border-radius:999px;background:rgba(20,32,52,.85);color:#cfe3ff;pointer-events:none;opacity:0;transition:opacity .3s';

  /* ---- panel ---- */

    ['4', '4', 'n'], ['5', '5', 'n'], ['6', '6', 'n'], ['e', 'e', 'fn'], ['−', '−', 'op'],
    ['1', '1', 'n'], ['2', '2', 'n'], ['3', '3', 'n'], ['ans', 'ans', 'fn'], ['+', '+', 'op'],

    <div class="scalc-hist" aria-live="polite"></div>

  const inp = box.querySelector('input'), histEl = box.querySelector('.scalc-hist'), prev = box.querySelector('.scalc-prev'), modeBtn = box.querySelector('[data-v="mode"]');

    catch (e) { prev.textContent = typeof e === 'string' ? e : 'Error'; prev.style.color = '#fca5a5'; setTimeout(() => { prev.style.color = ''; livePreview(); }, 1600); }

  }));
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); doEq(); } else if (e.key === 'Escape') box.hidden = true;
    else if (e.key.length === 1 && /[+*/^]/.test(e.key) && !inp.value && hist.length) { e.preventDefault(); insert('ans' + (e.key === '*' ? '×' : e.key === '/' ? '÷' : e.key)); } });
