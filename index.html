header.hero{display:flex;align-items:center;gap:20px;margin-top:18px;padding:22px 26px;background:linear-gradient(120deg,#ffffff 0%,#eef6f1 55%,#eaf1fb 100%);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 22px rgba(29,43,54,.06);position:relative;overflow:hidden}

header h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-.02em}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:18px 0 6px;font-size:15px}
.crumbs a{color:var(--muted);text-decoration:none;font-weight:700}.crumbs a:hover{text-decoration:underline}

@media (max-width:980px){.subjects{grid-template-columns:repeat(2,minmax(0,1fr))}}
.subj{border:3px solid var(--c);background:#fff;border-radius:18px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(29,43,54,.12)}
.subj .art{background:var(--s);display:flex;align-items:center;justify-content:center;aspect-ratio:16/10}
.subj .art svg{width:60%;height:auto}
.subj .lab{padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.subj .lab b{font-family:"Bricolage Grotesque",sans-serif;font-size:24px;color:var(--c)}
.subj .lab span{color:var(--muted);font-size:14px}
@media (max-width:720px){.subjects{grid-template-columns:1fr}.subj{flex-direction:row}.subj .art{aspect-ratio:auto;width:120px;flex:none}.subj .lab{flex-direction:column;justify-content:center}}
/* search */
.search{margin:6px 0 4px}
.search input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
.results{display:grid;gap:8px;margin-top:10px}
/* subject page */
.subhead{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.subhead .icon{width:64px;height:64px;border-radius:14px;background:var(--s);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.subhead .icon svg{width:80%}
.subhead h2{font-size:clamp(28px,4.5vw,40px);color:var(--c)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.unit{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:14px 16px;text-decoration:none;transition:box-shadow .12s,transform .12s}
.unit:hover{box-shadow:0 8px 18px rgba(29,43,54,.1);transform:translateY(-2px)}
.unit .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;color:var(--c);min-width:36px;line-height:1}
.unit h3{font-size:18px}
.unit p{margin:4px 0 0;color:var(--muted);font-size:14px}
.unit.empty{opacity:.65}
/* unit page */
.sections{display:grid;gap:16px}
.section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.section h3{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.section h3 .badge{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--s);color:var(--c)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.item{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;background:#fff;transition:border-color .12s,background .12s}
.item:hover{border-color:var(--c);background:var(--s)}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.item b{font-weight:700}
.item small{display:block;color:var(--muted);font-size:13px}
.none{color:var(--muted);font-style:italic;margin:0}
/* collapsible sections */
details.section{padding:0;overflow:hidden}
details.section>summary{list-style:none;cursor:pointer;padding:14px 18px;border-radius:16px}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary:hover{background:var(--s)}
details.section>summary:focus-visible{outline:3px solid var(--c);outline-offset:-3px}
details.section>summary h3{margin:0}
details.section .count{margin-left:auto;font-size:14px;font-weight:700;color:var(--c);background:var(--s);border-radius:999px;padding:2px 11px}
details.section .chev{width:22px;height:22px;flex:none;transition:transform .2s;color:var(--muted)}
details.section[open] .chev{transform:rotate(90deg)}
details.section[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details.section>.items,details.section>.none{padding:2px 18px 16px}
details.section.empty>summary{opacity:.6}
.sect-tools{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.sect-tools button{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
.sect-tools button:hover{border-color:var(--c)}
footer{color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>

<script>
const ART={
 flask:c=>`<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M48 12h24M52 12v26L28 82a6 6 0 0 0 5 9h54a6 6 0 0 0 5-9L68 38V12" fill="#fff" stroke="${c}" stroke-width="5" stroke-linejoin="round"/><path d="M38 66h44l10 17a4 4 0 0 1-3 6H31a4 4 0 0 1-3-6z" fill="${c}" opacity=".85"/><circle cx="52" cy="76" r="4" fill="#fff"/><circle cx="66" cy="70" r="3" fill="#fff"/><circle cx="60" cy="54" r="3.5" fill="none" stroke="${c}" stroke-width="2.5"/><circle cx="66" cy="44" r="2.5" fill="none" stroke="${c}" stroke-width="2.5"/><circle cx="57" cy="32" r="2" fill="${c}"/></svg>`,
 pendulum:c=>`<svg viewBox="0 0 120 100" aria-hidden="true"><path d="M18 12h84" stroke="${c}" stroke-width="6" stroke-linecap="round"/><path d="M60 12 84 70" stroke="${c}" stroke-width="3"/><path d="M60 12 36 70" stroke="${c}" stroke-width="2" stroke-dasharray="4 4" opacity=".45"/><path d="M30 76q30 22 60 0" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="3 6" stroke-linecap="round"/><circle cx="36" cy="72" r="10" fill="${c}" opacity=".3"/><circle cx="86" cy="74" r="12" fill="${c}"/><path d="M100 64h12M102 74h14M100 84h12" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`,
 molecule:c=>{const hx=(cx,cy,r)=>Array.from({length:6},(_,k)=>{const a=Math.PI/6+k*Math.PI/3;return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);}).join(" ");
   return `<svg viewBox="0 0 120 100" aria-hidden="true"><polygon points="${hx(48,52,26)}" fill="#fff" stroke="${c}" stroke-width="5" stroke-linejoin="round"/><polygon points="${hx(48,52,15)}" fill="none" stroke="${c}" stroke-width="3" opacity=".55"/><line x1="70.5" y1="39" x2="86" y2="30" stroke="${c}" stroke-width="5" stroke-linecap="round"/><circle cx="90" cy="28" r="7" fill="${c}"/><line x1="48" y1="78" x2="48" y2="92" stroke="${c}" stroke-width="5" stroke-linecap="round"/><rect x="74" y="58" width="38" height="28" rx="7" fill="${c}"/><text x="93" y="78" font-size="17" font-weight="800" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif">AP</text></svg>`;},
 dna:c=>{let s="";for(let i=0;i<=10;i++){const y=8+i*8.4,x1=60+26*Math.sin(i*.62),x2=60-26*Math.sin(i*.62);s+=`<line x1="${x1.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="3" opacity=".55"/><circle cx="${x1.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${c}"/><circle cx="${x2.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2.5"/>`;}return `<svg viewBox="0 0 120 100" aria-hidden="true">${s}</svg>`;}};
const ICON={warmups:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 18a5 5 0 0 1 10 0" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 5v3M5.6 8.6l2.1 2.1M18.4 8.6l-2.1 2.1M3 13h2M19 13h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
 tests:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3h9l3 3v15H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 9h6M9 13h6M9 17h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="17" r="3.2" fill="currentColor"/></svg>`,
 labs:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7.5 15h9" stroke="currentColor" stroke-width="2"/></svg>`,
 activities:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4h10l3 6-8 10L4 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 10h16M12 20 9 10l3-6 3 6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`,
 simulations:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M10 8.2v5.6l4.6-2.8z" fill="currentColor"/></svg>`,

 studyguides:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 5.5c3-1.3 6-1.3 9 .5 3-1.8 6-1.8 9-.5V19c-3-1.3-6-1.3-9 .5-3-1.8-6-1.8-9-.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6v13.5" stroke="currentColor" stroke-width="2"/></svg>`,
selftaught:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M22 9v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,

 worksheets:`<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 3h12v18H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 15.5l1.3 1.3 2.4-2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

const SECT=[["warmups","Warm-Ups"],["labs","Labs"],["simulations","Simulations"],["activities","Activities"],["lessons","Lessons"],["selftaught","Self-Taught Lessons"],["slides","Slides"],["notes","Cornell Notes"],["worksheets","Worksheets"],["formative","Formative Assessments"],["studyguides","Study Guides"],["tests","Tests"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const $=s=>document.querySelector(s);
const count=u=>SECT.reduce((a,[k])=>a+(u[k]||[]).length,0);
const sty=s=>`--c:${s.color};--s:${s.soft}`;
document.title=SITE.title;$("#title").textContent=SITE.title;$("#subtitle").textContent=SITE.subtitle;
function crumbs(parts){$("#crumbs").innerHTML=parts.map((p,i)=>i<parts.length-1?`<a href="${p[1]}" data-go="${p[1].slice(1)}">${esc(p[0])}</a><span aria-hidden="true">›</span>`:`<b aria-current="page">${esc(p[0])}</b>`).join("");}
function home(){crumbs([["Home","#"]]);
  $("#main").innerHTML=`<div class="subjects">${SITE.subjects.map(s=>{const n=s.units.reduce((a,u)=>a+count(u),0);return `<a class="subj" href="#${slug(s.name)}" data-go="${slug(s.name)}" style="${sty(s)}"><span class="art">${ART[s.art](s.color)}</span><span class="lab"><b>${esc(s.name)}</b><span>${s.units.length} units · ${n} activities</span></span></a>`;}).join("")}</div>
   <div class="search"><label for="q"><b>Looking for something?</b></label><input id="q" type="search" placeholder="Type a topic, like photosynthesis or vectors" autocomplete="off"><div class="results" id="results"></div></div>`;
  $("#q").addEventListener("input",e=>{const q=e.target.value.trim().toLowerCase();if(q.length<2){$("#results").innerHTML="";return;}const hits=[];
    SITE.subjects.forEach(s=>s.units.forEach((u,ui)=>SECT.forEach(([k,lab])=>(u[k]||[]).forEach(it=>{if(it.title.toLowerCase().includes(q)||u.name.toLowerCase().includes(q))hits.push({s,u,ui,lab,it});}))));
    $("#results").innerHTML=hits.length?hits.slice(0,30).map(h=>`<a class="item" style="${sty(h.s)}" href="${esc(h.it.file)}"><span class="dot"></span><span><b>${esc(h.it.title)}</b><small>${esc(h.s.name)} · Unit ${h.ui+1} · ${esc(h.lab)}</small></span></a>`).join(""):`<p class="none">No matches yet.</p>`;});}
function subject(s){crumbs([["Home","#"],[s.name,"#"+slug(s.name)]]);
  $("#main").innerHTML=`<div class="subhead" style="${sty(s)}"><span class="icon">${ART[s.art](s.color)}</span><h2>${esc(s.name)}</h2></div>
   <div class="units">${s.units.map((u,i)=>{const n=count(u);return `<a class="unit${n?"":" empty"}" style="${sty(s)}" href="#${slug(s.name)}/${i+1}" data-go="${slug(s.name)}/${i+1}"><span class="num">${i+1}</span><span><h3>${esc(u.name)}</h3><p>${n?SECT.map(([k,l])=>(u[k]||[]).length?`${u[k].length} ${({warmups:"warm-up",labs:"lab",activities:"activity",simulations:"simulation",lessons:"lesson",selftaught:"self-taught lesson",slides:"slide deck",notes:"note sheet",worksheets:"worksheet",formative:"assessment",studyguides:"study guide",tests:"test"})[k]}${u[k].length>1?"s":""}`:"").filter(Boolean).join(" · "):"Coming soon"}</p></span></a>`;}).join("")}</div>`;}
function unit(s,i){const u=s.units[i];crumbs([["Home","#"],[s.name,"#"+slug(s.name)],[`Unit ${i+1}`,`#${slug(s.name)}/${i+1}`]]);
  $("#main").innerHTML=`<div class="subhead" style="${sty(s)}"><span class="icon">${ART[s.art](s.color)}</span><div><p style="margin:0;color:var(--muted);font-weight:700">${esc(s.name)} · Unit ${i+1}</p><h2>${esc(u.name)}</h2></div></div>
   <div class="sect-tools" style="${sty(s)}"><button type="button" id="openAll">Open all</button><button type="button" id="closeAll">Close all</button></div>
   <div class="sections">${SECT.filter(([k])=>u[k]!==undefined).map(([k,l])=>{const n=(u[k]||[]).length;return `<details class="section${n?"":" empty"}" style="${sty(s)}"><summary><h3 id="h-${k}"><span class="badge">${ICON[k]}</span>${l}<span class="count" aria-label="${n} posted">${n}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></h3></summary>${n?`<div class="items">${u[k].map(it=>`<a class="item" href="${esc(it.file)}"><span class="dot"></span><span><b>${esc(it.title)}</b></span></a>`).join("")}</div>`:`<p class="none">Nothing posted here yet.</p>`}</details>`;}).join("")}</div>`;
  const all=open=>document.querySelectorAll("#main details.section").forEach(d=>{d.open=open;});
  $("#openAll").addEventListener("click",()=>all(true));$("#closeAll").addEventListener("click",()=>all(false));}
function route(target){let raw=target;if(raw==null){try{raw=decodeURIComponent(location.hash.slice(1));}catch(e){raw="";}}const h=raw.split("/");const s=SITE.subjects.find(x=>slug(x.name)===h[0]);
  if(!s)home();else if(h[1]&&s.units[+h[1]-1])unit(s,+h[1]-1);else subject(s);window.scrollTo(0,0);const t=$("#main h2");if(t){t.setAttribute("tabindex","-1");t.focus({preventScroll:true});}}
/* Navigation works by clicking, even inside previews that block page links */
document.addEventListener("click",e=>{const a=e.target.closest("[data-go]");if(!a)return;e.preventDefault();const t=a.dataset.go;
  try{history.pushState(null,"","#"+t);}catch(err){}route(t);});
window.addEventListener("popstate",()=>route());
window.addEventListener("hashchange",()=>route());
route();
</script>
</body>
